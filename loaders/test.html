<div id="s2s-test"></div>
<script>
(function () {
  var url = "https://SITE-NAME.netlify.app/sections/test.html";
  var box = document.getElementById("s2s-test");
  fetch(url + "?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      box.innerHTML = html;
      box.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        Array.prototype.forEach.call(old.attributes, function (a) { s.setAttribute(a.name, a.value); });
        s.text = old.text;
        old.replaceWith(s);
      });
    })
    .catch(function (e) { console.error("S2S section failed to load:", url, e); });
})();
</script>
