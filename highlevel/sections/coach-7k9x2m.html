<script>
/* ========================= config + tiny API layer ========================= */
var API_URL='https://iiaqezfiqkonajqqcrcj.supabase.co/functions/v1/super-api';
var ANON='sb_publishable_sNBfL6rf0cJwO2Sh8GSZqA_3hkEGkax';
/* the hosted Transformation Portal — tapping "Open full profile" deep-links into that client's editor (#coach-edit=<id>).
   Set it in ONE place: the <meta name="s2s-portal-url"> tag in the <head>. (Also overridable via ?portal=… or window.S2S_PORTAL_URL.) */
var PORTAL_URL=(function(){
  try{var mt=document.querySelector('meta[name="s2s-portal-url"]');if(mt&&mt.content&&mt.content.trim())return mt.content.trim();}catch(e){}
  try{var q=new URLSearchParams(location.search).get('portal');if(q)return q;}catch(e){}
  try{if(window.S2S_PORTAL_URL)return window.S2S_PORTAL_URL;}catch(e){}
  return 'https://s2sfit.com/diet-plan';
})();
var TOKEN=null;
try{TOKEN=localStorage.getItem('s2s_coach_tok')||null;}catch(e){}
function api(action,payload){
  var headers={'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON};
  return fetch(API_URL,{method:'POST',headers:headers,body:JSON.stringify(Object.assign({action:action,token:TOKEN},payload||{}))})
    .then(function(r){return r.json().then(function(j){ if(!r.ok||j.error) throw new Error(j.error||('Request failed ('+r.status+')')); return j.data; });});
}
function overview(){
  var url=API_URL.replace(/\/[^\/]+$/,'/s2s-overview');
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({token:TOKEN})})
    .then(function(r){return r.json();}).then(function(j){return (j&&j.data)||j||{};}).catch(function(){return {};});
}
/* ========================= helpers ========================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function app(h){$('app').innerHTML=h;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowHM(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function num(v){var n=Number(v);return isFinite(n)?n:0;}
function fmtDate(iso){iso=String(iso||'').slice(0,10);if(!iso)return '';var d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function ago(iso){var t=Date.parse(iso||'');if(!t)return '';var s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';var m=s/60;if(m<60)return Math.floor(m)+'m ago';var h=m/60;if(h<24)return Math.floor(h)+'h ago';var dd=h/24;if(dd<7)return Math.floor(dd)+'d ago';return fmtDate(iso);}
function initial(s){return (String(s||'?').trim().charAt(0)||'?').toUpperCase();}
function toast(msg,bad){var t=document.createElement('div');t.className='toast';if(bad)t.style.background='var(--crit)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function calOf(t){t=t||{};if(t.cal!=null)return num(t.cal);return num(t.p)*4+num(t.c)*4+num(t.f)*9;}
function sumNutr(items){return (items||[]).reduce(function(a,it){a.cal+=num(it&&it.cal);a.p+=num(it&&it.p);a.c+=num(it&&it.c);a.f+=num(it&&it.f);return a;},{cal:0,p:0,c:0,f:0});}
function round(n){return Math.round(num(n));}
function kg(v){v=String(v||'').trim();if(!v)return 0;var m=v.match(/[\d.]+/);return m?num(m[0]):0;}
function est1RM(w,r){w=num(w);r=num(r);if(w<=0||r<=0)return 0;if(r===1)return Math.round(w);return Math.round(w*(1+r/30));}  /* Epley — matches the portal/client runner */
function uid(){return 'wk'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

var CLIENTS=[], PLANS={}, FILTER='all', SEARCH='';

/* ========================= AUTH ========================= */
function renderLogin(err,busy){
  app('<div class="cm-top"><div class="cm-logo">S2S</div><div><div class="cm-title">Coach panel</div><div class="cm-sub">mobile access</div></div></div>'+
    '<div class="cm-body" style="padding-top:40px">'+
      '<div style="text-align:center;margin-bottom:22px"><div class="cm-av" style="width:64px;height:64px;font-size:26px;margin:0 auto 10px">💪</div>'+

function clientStatus(c){
  var p=PLANS[c.id]||{};var badges=[];

  try{var st=p.status||{};if(st.nutrition==='overdue'||st.training==='overdue')badges.push(['due','⚠ plan due']);}catch(e){}

function renderClients(){

    if(FILTER==='due'){var st=p.status||{};return st.nutrition==='overdue'||st.training==='overdue';}
    return true;
  }).sort(function(a,b){return String(a.name||'').toLowerCase()<String(b.name||'').toLowerCase()?-1:1;});

      var p=PLANS[c.id]||{};var sub=(p.title||'Diet Plan')+((p.profile&&p.profile.goal)?(' · '+esc(p.profile.goal)):'');

        '<div style="flex:1;min-width:0"><div class="cm-cl-nm">'+esc(c.name||c.email||'Client')+'</div><div class="cm-cl-sub">'+sub+'</div>'+(badges?'<div class="cm-badges">'+badges+'</div>':'')+'</div><span class="cm-go">›</span></button>';

  app(html);

    '<div class="cm-st"><div class="k">Logged today</div><div class="v">'+(tot.cal?round(tot.cal).toLocaleString():'—')+'</div><div class="d">'+(tot.cal?('kcal · '+round(tot.p)+'P '+round(tot.c)+'C '+round(tot.f)+'F'):'nothing logged yet')+'</div></div>'+

    '<div class="cm-st"><div class="k">Goal</div><div class="v" style="font-size:15px;margin-top:6px">'+esc(prof.goal||'—')+'</div><div class="d">'+esc(prof.duration||CURPLAN&&CURPLAN.title||'')+'</div></div>'+
  '</div>';
  var profCard='<div class="uline">Profile</div><div class="cm-ev">'+
    [['Email',CUR.email],['Start weight',prof.startWeight],['Current weight',prof.weight||(last&&last.value+' kg')],['Height',prof.height],['Diet',prof.diet],['Phone',prof.phone]]
     .filter(function(x){return x[1];}).map(function(x){return '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0"><span class="muted">'+x[0]+'</span><span style="font-weight:600;text-align:right">'+esc(x[1])+'</span></div>';}).join('')+
  '</div>';

  var wkoBtn='<button class="btn" style="margin:2px 0 8px" onclick="wkOpen()">🏋 Log a workout for '+esc((CUR.name||'client').split(' ')[0])+'</button>';
  var openBtn='<button class="btn ghost" style="margin:0 0 10px" onclick="openPortalEdit()">✏️ Open full profile to edit ↗</button>';

function activityHTML(){
  var d=cur();var ev=[];
  (d.logs||[]).forEach(function(l){var items=l.items||[];if(!items.length)return;var s=sumNutr(items);ev.push({type:'log',date:String(l.log_date||'').slice(0,10),ms:Date.parse((l.updated_at||l.log_date)||0)||0,pk:String(l.log_date||'').slice(0,10),count:items.length,tot:s});});
  (d.journal||[]).forEach(function(j){ev.push({type:'journal',date:String(j.date||'').slice(0,10),ms:Date.parse(j.created_at||j.date||0)||0,j:j,pk:j.id});});

  (d.workouts||[]).forEach(function(w){ev.push({type:'workout',date:String(w.date||'').slice(0,10),ms:Date.parse(w.created_at||w.date||0)||0,w:w});});

/* compact inline SVG line chart. series = [{label,color,pts:[{date,value}]}] (dates aligned across series) */
function cmChart(series,opts){
  opts=opts||{};series=(series||[]).map(function(s){return {label:s.label,color:s.color||'#E8170D',pts:(s.pts||[]).filter(function(p){return p&&p.date&&p.value!=null&&isFinite(+p.value);}).slice().sort(function(a,b){return a.date<b.date?-1:1;})};}).filter(function(s){return s.pts.length;});
  if(!series.length)return '<div class="small muted" style="padding:6px 2px 10px">Not enough data to chart yet.</div>';
  var W=320,H=132,pl=32,pr=12,pt=12,pb=22;
  var dset={};series.forEach(function(s){s.pts.forEach(function(p){dset[p.date]=1;});});
  var dates=Object.keys(dset).sort();var xi={};dates.forEach(function(d,i){xi[d]=i;});var n=dates.length;
  var vals=[];series.forEach(function(s){s.pts.forEach(function(p){vals.push(+p.value);});});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(opts.min!=null)mn=Math.min(mn,opts.min);if(mn===mx){mn-=1;mx+=1;}
  var iw=W-pl-pr,ih=H-pt-pb;
  var X=function(i){return pl+(n<=1?iw/2:i*(iw/(n-1)));};var Y=function(v){return pt+ih-((v-mn)/(mx-mn))*ih;};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">';
  [mx,(mn+mx)/2,mn].forEach(function(gv){var gy=Y(gv);svg+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--border)" stroke-width="1"/>';svg+='<text x="'+(pl-4)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" text-anchor="end" style="fill:var(--muted)">'+(Math.round(gv*10)/10)+'</text>';});
  series.forEach(function(s){var d=s.pts.map(function(p,i){return (i?'L':'M')+X(xi[p.date]).toFixed(1)+' '+Y(+p.value).toFixed(1);}).join(' ');
    svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.pts.forEach(function(p){svg+='<circle cx="'+X(xi[p.date]).toFixed(1)+'" cy="'+Y(+p.value).toFixed(1)+'" r="2.6" fill="'+s.color+'"/>';});});
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-size="9" text-anchor="start" style="fill:var(--muted)">'+esc(fmtDate(dates[0]))+'</text>';
  if(n>1)svg+='<text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="9" text-anchor="end" style="fill:var(--muted)">'+esc(fmtDate(dates[n-1]))+'</text>';
  svg+='</svg>';
  var legend=series.length>1?('<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:2px">'+series.map(function(s){return '<span class="small" style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:'+s.color+';display:inline-block"></i>'+esc(s.label||'')+'</span>';}).join('')+'</div>'):'';
  return '<div style="border:1px solid var(--border);border-radius:12px;background:var(--card2);padding:10px 10px 7px;margin-bottom:4px">'+svg+legend+'</div>';
}
/* unify measurement history across logs[].values + legacy per-key arrays → {key:[{date,value}]} */
function measSeries(m){
  var meas=(m&&m.measurements)||{};var by={};
  function add(k,date,v){if(v==null||v===''||!isFinite(+v)||!date)return;by[k]=by[k]||{};by[k][String(date).slice(0,10)]=+v;}
  if(Array.isArray(meas.logs))meas.logs.forEach(function(lg){var v=(lg&&lg.values)||{};Object.keys(v).forEach(function(k){add(k,lg.date,v[k]);});});
  Object.keys(meas).forEach(function(k){if(k==='logs')return;if(Array.isArray(meas[k]))meas[k].forEach(function(e){if(e&&e.value!=null)add(k,e.date,e.value);});});
  var out={};Object.keys(by).forEach(function(k){out[k]=Object.keys(by[k]).sort().map(function(d){return {date:d,value:by[k][d]};});});
  return out;
}

   Reads the client's training plan (new v2 workouts, or legacy training.days), lets the coach enter
   what the client actually did (reps/weight/… per set, tick off each set), then saves a workout log
   that is byte-for-byte compatible with the client's own runner — so it shows up in the client portal,
   the admin editor, and this app's Activity/Progress tabs, and marks the day done on the client's calendar. */

  if(Array.isArray(e.sets)&&e.sets.length)return e.sets.map(function(st){var o=Object.assign({},st);track.forEach(function(v){if(o[v]==null)o[v]=(e.scheme&&e.scheme[v]!=null)?e.scheme[v]:'';});return o;});

  toast('✨ Generating…');
  wkGenUrl().then(function(url){
    if(!url){toast('Set up the Smart webhook in the portal (Exercise library → ⚙) first',true);return;}
    return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({name:name,bodyPart:'',equipment:en.equipment||'',category:'',allowed:{bodyParts:[],categories:[],equipment:[]}})})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(data){
        var g=wkGenExtract(data);
        if(!(g.howto||g.mistakes||g.cues||g.breathing||g.video||g.equipment))throw new Error('empty reply');
        en.lib=en.lib||{};
        if(g.howto)en.lib.howto=g.howto;if(g.mistakes)en.lib.mistakes=g.mistakes;if(g.cues)en.lib.cues=g.cues;if(g.breathing)en.lib.breathing=g.breathing;if(g.video)en.lib.video=g.video;
        if(g.equipment&&!en.equipment)en.equipment=g.equipment;
        en.showInfo=true;wkGenSaveLib(en,g);wkRender();toast('✨ Generated — details filled');
      });
  }).catch(function(e){toast('Could not generate — '+((e&&e.message)||'error'),true);});
}
/* if this exercise is already in the shared library, persist the generated details back (so every client reuses them) */
function wkGenSaveLib(en,g){

    if(g.equipment&&!ex.equipment)ex.equipment=g.equipment;if(g.bodyPart&&!ex.bodyPart)ex.bodyPart=g.bodyPart;if(g.category&&!ex.category)ex.category=g.category;

/* ---- step 2: build WK from the chosen workout and run the entry screen ---- */
function wkStart(kind,id){ wkEnsureLib().then(function(){wkStartBuild(kind,id);}); }
function wkStartBuild(kind,id){
  var p=CURPLAN||{};var entries=[],dayName='Workout',dayId='';
  if(kind==='v2'){
    var ws=((p.training&&p.training.v2&&p.training.v2.workouts)||[]);
    var w=ws.find(function(x){return x.id===id;});if(!w){toast('Workout not found',true);return;}
    dayName=w.name||'Workout';dayId=w.id;
    (w.sections||[]).forEach(function(sec){(sec.exercises||[]).forEach(function(e){entries.push(wkEntryFromEx(e,sec.name||''));});});
  }else if(kind==='day'){
    var days=((p.training&&p.training.days)||[]);var dy=days[+id];if(!dy){toast('Day not found',true);return;}
    dayName=dy.name||'Workout';dayId=dy.id||('day'+id);
    (dy.sections||[dy]).forEach(function(sec){((sec.exercises)||[]).forEach(function(e){entries.push(wkEntryFromEx(e,(sec!==dy&&sec.name)||''));});});
  }else{dayName='Freestyle session';}
  var date=($('wk-date')&&$('wk-date').value)||todayISO();
  WK={client_id:CUR.id,date:date,day_id:dayId,day_name:dayName,entries:entries,kind:kind};
  WK_START=Date.now();
  if(!entries.length&&kind!=='free')wkAddFreeEx(true);
  wkRender();
}
function wkTotals(){
  var sets=0,done=0,all=0,reps=0,vol=0;
  (WK?WK.entries:[]).forEach(function(en){(en.sets||[]).forEach(function(s){
    all++;if(s.done)done++;
    var any=(en.track||['reps','weight']).some(function(v){return String(s[v]||'').trim()!=='';});
    if(s.done||any){sets++;var r=num(s.reps),w=num(s.weight);reps+=r;vol+=r*w;}
  });});
  return {sets:sets,done:done,all:all,reps:reps,vol:vol,pct:all?Math.round(done/all*100):0};
}

    (hasInfo?'<button class="wk-mini'+(en.showInfo?' on':'')+'" onclick="wkInfo('+ei+')" title="How-to &amp; cues">ℹ</button>':'')+
    '<button class="wk-mini" onclick="wkGen('+ei+')" title="Auto-generate execution, cues, equipment &amp; demo (Smart)">✨</button>'+

    (en.lib.howto?'<div><b>✅ How to</b> '+esc(en.lib.howto)+'</div>':'')+

    (en.lib.cues?'<div><b>⭐ Cues</b> '+esc(en.lib.cues)+'</div>':'')+
    (en.lib.breathing?'<div><b>🫁 Breathing</b> '+esc(en.lib.breathing)+'</div>':'')+'</div>';
  var equips=wkEquipFor(en);
  h+='<div class="wk-chips"><span class="wk-chlab">Equip</span><button class="wk-chip'+(!en.equipment?' on':'')+'" onclick="wkSetEquip('+ei+',\'\')">Any</button>'+
    equips.map(function(x){return '<button class="wk-chip'+(en.equipment===x?' on':'')+'" onclick="wkSetEquip('+ei+',\''+encodeURIComponent(x)+'\')">'+esc(x)+'</button>';}).join('')+
    '<button class="wk-chip add" onclick="wkAddEquip('+ei+')">＋</button></div>';
  var brands=wkBrandsFor(en);
  h+='<div class="wk-chips"><span class="wk-chlab">Brand</span><button class="wk-chip'+(!en.brand?' on':'')+'" onclick="wkSetBrand('+ei+',\'\')">Default</button>'+
    brands.map(function(b){return '<button class="wk-chip'+(en.brand===b?' on':'')+'" onclick="wkSetBrand('+ei+',\''+encodeURIComponent(b)+'\')">'+esc(b)+'</button>';}).join('')+
    '<button class="wk-chip add" onclick="wkAddBrand('+ei+')">＋</button></div>';
  h+='<div class="wk-row" style="grid-template-columns:'+gt+'"><div class="wk-th">#</div>'+cols.map(function(v){return '<div class="wk-th">'+esc(wkVarLabel(v))+'</div>';}).join('')+'<div class="wk-th">✓</div></div>';
  en.sets.forEach(function(s,si){
    h+='<div class="wk-row" style="grid-template-columns:'+gt+'"><div class="wk-no">'+(si+1)+'</div>'+
      cols.map(function(v){return '<input type="'+(v==='tempo'?'text':'number')+'" inputmode="'+(v==='tempo'?'text':'decimal')+'" value="'+esc(s[v]||'')+'" placeholder="'+esc((s.t&&s.t[v])||'')+'" oninput="wkSet('+ei+','+si+',\''+v+'\',this.value)">';}).join('')+
      '<button class="wk-done'+(s.done?' on':'')+'" onclick="wkDone('+ei+','+si+')">'+(s.done?'✓':'')+'</button></div>';
  });
  h+='<div style="display:flex;gap:8px;margin-top:7px"><button class="cm-back" style="padding:5px 11px" onclick="wkAddSet('+ei+')">＋ set</button><button class="cm-back" style="padding:5px 11px" onclick="wkDelSet('+ei+')">－ set</button></div></div>';
  return h;
}
function wkRender(){
  if(!WK)return;
  var head='<div class="cm-top"><button class="cm-back" onclick="wkCancel()">‹</button><div style="flex:1;min-width:0"><div class="cm-title" style="font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(WK.day_name||'Workout')+'</div><div class="cm-sub">'+esc(CUR.name||'Client')+' · '+esc(fmtDate(WK.date))+'</div></div></div>';
  var t=wkTotals();
  var body='<div class="cm-body"><div class="small muted" style="margin:0 0 10px">Enter what '+esc((CUR.name||'the client').split(' ')[0])+' actually did, then tick ✓ each set completed.</div>';
  var lastSec=null;
  WK.entries.forEach(function(en,ei){var sc=en.sec||'';if(sc!==lastSec){lastSec=sc;if(sc)body+='<div class="wk-sec">'+esc(sc)+'</div>';}body+=wkExHTML(en,ei);});
  body+='<button class="btn ghost" style="margin:4px 0 14px" onclick="wkAddFreeEx()">＋ Add exercise</button>';
  body+='<div class="cm-st" style="margin-bottom:10px"><div class="k">Session so far</div><div class="v">'+t.sets+' set'+(t.sets===1?'':'s')+' · '+round(t.vol).toLocaleString()+' kg</div><div class="d">'+t.done+'/'+t.all+' ticked done · '+t.pct+'%</div></div>';
  body+='<button class="btn" onclick="wkFinish()">✓ Save session</button><button class="btn ghost" style="margin-top:8px" onclick="wkCancel()">Cancel</button></div>';
  app(head+body);
}
/* input handlers — commit into the model WITHOUT re-rendering (so typing never loses focus); only ✓/add/del re-render */
function wkSet(ei,si,v,val){if(!WK)return;var en=WK.entries[ei];if(en&&en.sets[si])en.sets[si][v]=val;}
function wkName(ei,val){if(!WK)return;var en=WK.entries[ei];if(en)en.name=val;}
function wkDone(ei,si){if(!WK)return;var en=WK.entries[ei];if(!en||!en.sets[si])return;en.sets[si].done=!en.sets[si].done;wkRender();}
function wkAddSet(ei){if(!WK)return;var en=WK.entries[ei];if(!en)return;var track=en.track&&en.track.length?en.track:['reps','weight'];var last=en.sets[en.sets.length-1]||{};var s={done:false,t:(last.t||{})};track.forEach(function(v){s[v]='';});en.sets.push(s);wkRender();}
function wkDelSet(ei){if(!WK)return;var en=WK.entries[ei];if(!en||en.sets.length<=1)return;en.sets.pop();wkRender();}
function wkDelEx(ei){if(!WK)return;WK.entries.splice(ei,1);wkRender();}
function wkSetEquip(ei,v){v=decodeURIComponent(v);var en=WK&&WK.entries[ei];if(!en)return;en.equipment=(en.equipment===v?'':v);wkRender();}
function wkAddEquip(ei){var en=WK&&WK.entries[ei];if(!en)return;var v=prompt('Equipment used for “'+(en.name||'exercise')+'”\n(e.g. Barbell, Dumbbell, Machine, Cable, Smith, Kettlebell):',en.equipment||'');if(v==null)return;en.equipment=v.trim();wkRender();}
function wkSetBrand(ei,b){b=decodeURIComponent(b);var en=WK&&WK.entries[ei];if(!en)return;en.brand=(en.brand===b?'':b);wkRender();}
function wkAddBrand(ei){var en=WK&&WK.entries[ei];if(!en)return;var b=prompt('Machine brand / variation for “'+(en.name||'exercise')+'”\n(e.g. Hammer Strength, Cybex, Life Fitness):',en.brand||'');if(b==null)return;en.brand=b.trim();wkRender();}
function wkSwapAlt(ei){var en=WK&&WK.entries[ei];if(!en)return;var opts=[en.origName||en.name].concat(en.alts||[]);if(opts.length<2)return;var i=opts.indexOf(en.name);en.name=opts[(i+1)%opts.length];wkRender();}
/* ── Swap an exercise: pick any exercise from the library (keeps the logged sets); programmed alternatives show as quick-picks ── */
var WK_SWAP_EI=-1;
function wkSwapOpen(ei){
  if(!WK)return;
  if(!WK_LIB){wkEnsureLib().then(function(){wkSwapOpen(ei);});toast('Loading library…');return;}
  WK_SWAP_EI=ei;var en=WK.entries[ei];if(!en)return;
  var quick=[];[en.origName].concat(en.alts||[]).forEach(function(n){if(n&&quick.indexOf(n)<0&&n!==en.name)quick.push(n);});
  var quickHTML=quick.length?('<div class="small muted" style="margin:0 0 6px">Programmed alternatives</div><div class="wk-chips" style="margin-bottom:14px">'+quick.map(function(n){return '<button class="wk-chip" onclick="wkSwapToName(\''+encodeURIComponent(n)+'\')">⇄ '+esc(n)+'</button>';}).join('')+'</div>'):'';
  var head='<div class="cm-top"><button class="cm-back" onclick="wkRender()">‹</button><div style="flex:1;min-width:0"><div class="cm-title" style="font-size:16px">Swap exercise</div><div class="cm-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Replacing: '+esc(en.name||'—')+'</div></div></div>';
  var body='<div class="cm-body"><div class="small muted" style="margin:0 0 10px">Pick a replacement — the sets you’ve logged stay, and its demo, cues &amp; equipment come along.</div>'+
    quickHTML+
    '<input id="wk-swap-q" class="wk-ex-nm" style="width:100%;margin-bottom:10px" placeholder="🔍 Search the exercise library…" oninput="wkSwapFilter()" autocomplete="off">'+
    '<div id="wk-swap-list"></div>'+
    '<button class="btn ghost" style="margin-top:12px" onclick="wkRender()">Cancel</button></div>';
  app(head+body);wkSwapFilter();
  try{setTimeout(function(){var q=document.getElementById('wk-swap-q');if(q)q.focus();},60);}catch(e){}
}
function wkSwapFilter(){
  var host=document.getElementById('wk-swap-list');if(!host)return;
  var q=((document.getElementById('wk-swap-q')||{}).value||'').trim().toLowerCase();
  var list=(WK_LIB||[]).filter(function(e){return e&&e.name&&(!q||String(e.name).toLowerCase().indexOf(q)>=0||String(e.category||e.muscle||e.group||'').toLowerCase().indexOf(q)>=0);});
  list.sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
  var shown=list.slice(0,60);
  if(!shown.length){host.innerHTML='<div class="small muted" style="padding:8px 2px">No library matches'+(q?' for “'+esc(q)+'”':'')+'.</div>'+(q?'<button class="btn ghost" onclick="wkSwapCustom()">Use “'+esc(q)+'” as a custom exercise</button>':'');return;}
  host.innerHTML=shown.map(function(e){
    var sub=[e.category||e.muscle||e.group||'',e.equipment||''].filter(Boolean).join(' · ');
    return '<button class="wk-swap-item" onclick="wkSwapTo(\''+esc(e.id||'')+'\')"><span style="flex:1;min-width:0"><span class="wk-swap-nm">'+esc(e.name)+'</span>'+(sub?'<span class="wk-swap-sub">'+esc(sub)+'</span>':'')+'</span>'+(e.video?'<span class="wk-swap-vid">▶</span>':'')+'</button>';
  }).join('')+(list.length>60?'<div class="small muted" style="padding:6px 2px">+'+(list.length-60)+' more — keep typing to narrow it down.</div>':'');
}
function wkSwapTo(exId){
  var en=WK&&WK.entries[WK_SWAP_EI];if(!en)return;
  var e=WK_EXBYID[exId];if(!e){toast('Could not load that exercise',true);return;}
  en.name=e.name||en.name;en.origName=e.name||en.name;en.exId=e.id||'';
  en.alts=Array.isArray(e.alts)?e.alts.filter(Boolean):[];
  en.brand='';en.equipment=e.equipment||'';en.showInfo=false;
  en.lib={video:e.video||'',howto:e.howto||'',mistakes:e.mistakes||'',cues:e.cues||'',breathing:e.breathing||''};
  wkRender();toast('Swapped to '+(e.name||'exercise'));
}
function wkSwapToName(name){
  name=decodeURIComponent(name);var en=WK&&WK.entries[WK_SWAP_EI];if(!en)return;
  var lib=WK_EXBYNAME[String(name).toLowerCase()];if(lib){wkSwapTo(lib.id);return;}
  en.name=name;en.origName=name;en.exId='';en.brand='';en.equipment='';en.showInfo=false;en.lib={video:'',howto:'',mistakes:'',cues:'',breathing:''};
  wkRender();toast('Swapped to '+name);
}
function wkSwapCustom(){var q=((document.getElementById('wk-swap-q')||{}).value||'').trim();if(!q)return;wkSwapToName(encodeURIComponent(q));}
function wkDemo(ei){var en=WK&&WK.entries[ei];var v=en&&en.lib&&en.lib.video;if(!v){toast('No demo video for this exercise',true);return;}try{window.open(v,'_blank','noopener');}catch(e){location.href=v;}}
function wkInfo(ei){var en=WK&&WK.entries[ei];if(!en)return;en.showInfo=!en.showInfo;wkRender();}
function wkAddFreeEx(quiet){if(!WK)return;var tr=WK_DEFAULT_TRACK.slice();var s={done:false,t:{}};tr.forEach(function(v){s[v]='';});WK.entries.push({name:'',origName:'',exId:'',alts:[],track:tr,note:'',target:'',sec:'',brand:'',equipment:'',showInfo:false,lib:{video:'',howto:'',mistakes:'',cues:'',breathing:''},sets:[s]});if(!quiet)wkRender();}
function wkCancel(){if(WK&&wkTotals().sets>0&&!confirm('Discard this unsaved session?'))return;WK=null;renderClient();}
function wkFinish(){
  if(!WK)return;
  var entries=WK.entries.filter(function(en){
    if((en.name||'').trim())return true;
    return (en.sets||[]).some(function(s){return s.done||(en.track||[]).some(function(v){return String(s[v]||'').trim()!=='';});});
  });
  if(!entries.length){toast('Add at least one exercise or set first',true);return;}
  var totalSets=0,totalReps=0,volume=0,exs=[];
  entries.forEach(function(en){
    var best=0,evol=0,esets=0,ereps=0;
    (en.sets||[]).forEach(function(s){
      var any=(en.track||['reps','weight']).some(function(v){return String(s[v]||'').trim()!=='';});
      if(s.done||any){totalSets++;esets++;var r=num(s.reps),w=num(s.weight);totalReps+=r;ereps+=r;var sv=w?w*r:r;volume+=w?w*r:0;evol+=sv;if(w&&r)best=Math.max(best,est1RM(w,r));}
    });
    exs.push({name:en.name||'Exercise',brand:en.brand||'',equipment:en.equipment||'',est1rm:best||0,vol:Math.round(evol),sets:esets,reps:ereps});
  });
  var all=0,dn=0;entries.forEach(function(en){(en.sets||[]).forEach(function(s){all++;if(s.done)dn++;});});
  var completion=all?Math.round(dn/all*100):0;
  var log={id:uid(),client_id:CUR.id,date:WK.date,day_id:WK.day_id||'',day_name:WK.day_name||'Workout',
    entries:entries.map(function(en){return {name:en.name||'Exercise',exId:en.exId||'',origName:en.origName||en.name||'',brand:en.brand||'',equipment:en.equipment||'',track:en.track,note:en.note||'',sec:en.sec||'',
      sets:en.sets.map(function(s){var o={done:!!s.done};(en.track||[]).forEach(function(v){o[v]=s[v]||'';});return o;})};}),
    summary:{totalSets:totalSets,totalReps:totalReps,volume:Math.round(volume),exercises:exs,loggedBy:(ME.name||'Coach'),by:'coach'},
    completion:completion,duration_sec:Math.max(0,Math.round((Date.now()-WK_START)/1000)),done:completion>=100};
  toast('Saving…');
  api('saveWorkoutLog',{log:log}).then(function(){
    var c=cur();c.workouts=c.workouts||[];c.workouts.unshift(log);
    WK=null;CTAB='activity';renderClient();
    toast('Workout logged ✓ '+totalSets+' set'+(totalSets===1?'':'s')+' · '+round(volume).toLocaleString()+' kg');
  }).catch(function(e){toast((e&&e.message)||'Could not save',true);});
}

  api('listMessages',{clientId:id}).then(function(msgs){renderChat(msgs||[]);}).catch(function(e){$('chat-body').innerHTML='<div class="empty">Could not load messages.</div>';});
}
function renderChat(msgs){
  var html='<div class="cm-msgs">'+(msgs.length?msgs.map(function(m){
    var mine=(m.sender==='admin');
    return '<div class="cm-msg '+(mine?'me':'them')+'">'+(!mine?'<b style="font-size:11px;opacity:.75">'+esc(m.sender_name||CUR.name||'Client')+'</b><br>':'')+esc(m.text||'')+'<div class="t">'+ago(m.created_at)+'</div></div>';
  }).join(''):'<div class="empty">No messages yet — say hello 👋</div>')+'</div>';
  var cb=$('chat-body');if(cb)cb.innerHTML=html;
  // sticky composer at the very bottom of the app
  var old=$('chat-composer');if(old)old.remove();
  var comp=document.createElement('div');comp.id='chat-composer';comp.className='cm-composer';comp.style.maxWidth='460px';comp.style.margin='0 auto';comp.style.padding='10px 14px calc(10px + env(safe-area-inset-bottom))';
  comp.innerHTML='<input id="chat-in" placeholder="Message '+esc((CUR.name||'client').split(' ')[0])+'…" onkeydown="if(event.key===\'Enter\')sendChat()"><button onclick="sendChat()">Send</button>';
  $('app').appendChild(comp);
  if(cb)cb.scrollTop=cb.scrollHeight;window.scrollTo(0,document.body.scrollHeight);
}
function sendChat(){
  var el=$('chat-in');var txt=((el&&el.value)||'').trim();if(!txt)return;el.value='';
  api('sendMessage',{clientId:CUR.id,text:txt,media:null}).then(function(){
    api('listMessages',{clientId:CUR.id}).then(function(m){renderChat(m||[]);});
  }).catch(function(e){toast((e&&e.message)||'Could not send',true);if(el)el.value=txt;});
}

/* ========================= boot ========================= */
(function(){ if(TOKEN){ loadClients(); } else { renderLogin(); } })();
</script>
