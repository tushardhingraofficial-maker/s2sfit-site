.wk-th{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);text-align:center;overflow:hidden}
.wk-no{text-align:center;font-family:var(--disp);font-weight:900;font-size:15px;color:var(--muted)}
.wk-row input{padding:8px 3px;text-align:center;border-radius:9px;font-size:15px}
.wk-sel-in{padding:8px 15px 8px 3px;text-align:center;border-radius:9px;font-size:15px;font-weight:600;line-height:1.1;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23697079' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 4px center}
.wk-sel-in.empty{color:var(--muted)}
.wk-done{border:1px solid var(--border);background:var(--card2);border-radius:9px;height:38px;font-size:15px;font-weight:800;color:var(--muted);cursor:pointer}
.wk-done.on{background:var(--good);border-color:var(--good);color:#fff}
/* ===== floating coach chat widget (global inbox) ===== */
.cmfab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;border:none;box-shadow:0 10px 26px -8px rgba(232,23,13,.6);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cmfab svg{width:26px;height:26px}
.cmfab-badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#111;color:#fff;font-size:11px;font-weight:800;line-height:20px;text-align:center;border:2px solid var(--surface)}
.cmfab.pulse{animation:cmfabPulse 1.5s infinite}
@keyframes cmfabPulse{0%{box-shadow:0 0 0 0 rgba(232,23,13,.5)}70%{box-shadow:0 0 0 14px rgba(232,23,13,0)}100%{box-shadow:0 0 0 0 rgba(232,23,13,0)}}
.cmchat-ov{position:fixed;inset:0;z-index:950;background:rgba(10,12,18,.55);display:flex;flex-direction:column;justify-content:flex-end}
.cmchat-panel{background:var(--surface);border-radius:18px 18px 0 0;max-height:82vh;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;box-shadow:0 -14px 40px -16px rgba(0,0,0,.5)}
.cmchat-hd{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.cmchat-hd h3{margin:0;font-family:var(--disp);font-weight:900;font-size:18px;flex:1}
.cmchat-x{border:none;background:var(--card2);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
.cmchat-search{margin:0 16px 8px;padding:10px 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:11px;font-size:15px;font-family:inherit}
.cmchat-list{overflow-y:auto;padding:0 8px 16px}
.cmchat-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-radius:12px;padding:11px 10px;cursor:pointer;font-family:inherit;color:var(--text)}
.cmchat-row:active{background:var(--card2)}
.cmchat-row+.cmchat-row{border-top:1px solid var(--border)}
.cmchat-row .cm-av{flex:none}
.cmchat-main{flex:1;min-width:0}
.cmchat-nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmchat-prev{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.cmchat-row.unread .cmchat-prev{color:var(--text);font-weight:600}
.cmchat-meta{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cmchat-when{font-size:10.5px;color:var(--muted)}
.cmchat-ubadge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:20px;text-align:center}
/* inline SVG icon sizing (emoji→SVG sweep) */
svg.ic{width:16px;height:16px;vertical-align:-2px;flex:none}
svg.ic-emo{width:16px;height:16px;vertical-align:-2px;flex:none}
.cm-av svg.ic,.cm-av svg.ic-emo{width:50%;height:50%;vertical-align:middle}
h3 svg.ic,h3 svg.ic-emo{width:18px;height:18px;vertical-align:-3px;margin-right:2px}
.cm-qa button svg.ic,.cm-qa button svg.ic-emo{width:20px;height:20px;vertical-align:middle}

var API_URL='https://iiaqezfiqkonajqqcrcj.supabase.co/functions/v1/super-api';
var ANON='sb_publishable_sNBfL6rf0cJwO2Sh8GSZqA_3hkEGkax';
/* the hosted Transformation Portal — tapping "Open full profile" deep-links into that client's editor (#coach-edit=<id>).
   Set it in ONE place: the <meta name="s2s-portal-url"> tag in the <head>. (Also overridable via ?portal=… or window.S2S_PORTAL_URL.) */
var PORTAL_URL=(function(){
  try{var mt=document.querySelector('meta[name="s2s-portal-url"]');if(mt&&mt.content&&mt.content.trim())return mt.content.trim();}catch(e){}
  try{var q=new URLSearchParams(location.search).get('portal');if(q)return q;}catch(e){}
  try{if(window.S2S_PORTAL_URL)return window.S2S_PORTAL_URL;}catch(e){}
  return 'https://s2sfit.com/diet-plan';
})();
var TOKEN=null;
try{TOKEN=localStorage.getItem('s2s_coach_tok')||null;}catch(e){}
function api(action,payload){
  var headers={'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON};
  return fetch(API_URL,{method:'POST',headers:headers,body:JSON.stringify(Object.assign({action:action,token:TOKEN},payload||{}))})
    .then(function(r){return r.json().then(function(j){ if(!r.ok||j.error) throw new Error(j.error||('Request failed ('+r.status+')')); return j.data; });});
}
function overview(){
  var url=API_URL.replace(/\/[^\/]+$/,'/s2s-overview');
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({token:TOKEN})})
    .then(function(r){return r.json();}).then(function(j){return (j&&j.data)||j||{};}).catch(function(){return {};});
}

function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowHM(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function num(v){var n=Number(v);return isFinite(n)?n:0;}
function fmtDate(iso){iso=String(iso||'').slice(0,10);if(!iso)return '';var d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function ago(iso){var t=Date.parse(iso||'');if(!t)return '';var s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';var m=s/60;if(m<60)return Math.floor(m)+'m ago';var h=m/60;if(h<24)return Math.floor(h)+'h ago';var dd=h/24;if(dd<7)return Math.floor(dd)+'d ago';return fmtDate(iso);}
function initial(s){return (String(s||'?').trim().charAt(0)||'?').toUpperCase();}
function safeName(n){n=String(n==null?'':n).trim();return (!n||n.indexOf('@')>=0)?'':n;}   /* never show an email as a name */
function toast(msg,bad){var t=document.createElement('div');t.className='toast';if(bad)t.style.background='var(--crit)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function calOf(t){t=t||{};if(t.cal!=null)return num(t.cal);return num(t.p)*4+num(t.c)*4+num(t.f)*9;}
function sumNutr(items){return (items||[]).reduce(function(a,it){a.cal+=num(it&&it.cal);a.p+=num(it&&it.p);a.c+=num(it&&it.c);a.f+=num(it&&it.f);return a;},{cal:0,p:0,c:0,f:0});}
function round(n){return Math.round(num(n));}
function kg(v){v=String(v||'').trim();if(!v)return 0;var m=v.match(/[\d.]+/);return m?num(m[0]):0;}
function est1RM(w,r){w=num(w);r=num(r);if(w<=0||r<=0)return 0;if(r===1)return Math.round(w);return Math.round(w*(1+r/30));}  /* Epley — matches the portal/client runner */
function uid(){return 'wk'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ========================= AUTH ========================= */
function renderLogin(err,busy){
  app('<div class="cm-top"><div class="cm-logo">S2S</div><div><div class="cm-title">Coach panel</div><div class="cm-sub">mobile access</div></div></div>'+
    '<div class="cm-body" style="padding-top:40px">'+
      '<div style="text-align:center;margin-bottom:22px"><div class="cm-av" style="width:64px;height:64px;font-size:26px;margin:0 auto 10px">'+eicon('muscle')+'</div>'+
        '<div style="font-family:var(--disp);font-weight:900;font-size:24px">Welcome, Coach</div>'+
        '<div class="muted small">Sign in to view & manage your clients</div></div>'+
      '<div class="field"><label>Coach password</label><input id="cm-pw" type="password" placeholder="Your admin / coach password" autocomplete="current-password"></div>'+
      (err?'<div class="pill crit" style="display:block;text-align:center;margin-bottom:12px">'+esc(err)+'</div>':'')+
      '<button class="btn" id="cm-login" '+(busy?'disabled':'')+'>'+(busy?'Signing in…':'Sign in')+'</button>'+
      '<p class="small muted" style="margin-top:14px;text-align:center">Uses the same login as the S2S portal admin. Your session stays on this phone.</p>'+
      '<p class="small muted" style="margin-top:6px;text-align:center;opacity:.6">v'+esc((document.documentElement.getAttribute('data-version')||'')).toString()+'</p>'+
    '</div>');
  var inp=$('cm-pw');if(inp){inp.focus();inp.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});}
  var b=$('cm-login');if(b)b.onclick=doLogin;
}
function doLogin(){
  var pw=($('cm-pw')&&$('cm-pw').value||'').trim();
  if(!pw){renderLogin('Enter your password');return;}
  renderLogin('',true);
  api('adminLogin',{password:pw}).then(function(d){
    TOKEN=d&&d.token;if(!TOKEN)throw new Error('No session returned');
    try{localStorage.setItem('s2s_coach_tok',TOKEN);}catch(e){}
    loadClients();
  }).catch(function(e){renderLogin((e&&e.message)||'Wrong password');});
}
function logout(){TOKEN=null;try{localStorage.removeItem('s2s_coach_tok');}catch(e){}CLIENTS=[];PLANS={};CUR=null;cmChatDestroy();renderLogin();}

/* ========================= CLIENTS LIST ========================= */
function loadClients(){
  app('<div class="cm-top"><div class="cm-logo">S2S</div><div><div class="cm-title">Coach panel</div><div class="cm-sub">loading…</div></div></div><div class="empty"><span class="spin"></span></div>');
  Promise.all([api('listClients').catch(function(){return [];}), overview()]).then(function(r){
    CLIENTS=(r[0]||[]).filter(Boolean);
    var ov=r[1]||{};PLANS={};
    (ov.plans||[]).forEach(function(p){if(p&&p.client_id)PLANS[p.client_id]=p;});
    renderClients();
  }).catch(function(e){
    if(/sign in|session|expired|token/i.test((e&&e.message)||'')){logout();return;}
    app('<div class="cm-top"><div class="cm-logo">S2S</div><div class="cm-title">Coach panel</div></div><div class="empty">Could not load clients.<br><button class="btn ghost" style="margin-top:14px;max-width:200px" onclick="loadClients()">Retry</button><br><button class="btn ghost" style="margin-top:8px;max-width:200px" onclick="logout()">Sign out</button></div>');
  });
}
function clientStatus(c){
  var p=PLANS[c.id]||{};var badges=[];
  if(p.archived)badges.push(['due',''+eicon('box')+' archived']);
  // plan-update overdue (from alloc dates + review cycle) — best effort
  try{var st=p.status||{};if(st.nutrition==='overdue'||st.training==='overdue')badges.push(['due',''+eicon('warn')+' plan due']);}catch(e){}
  return badges;
}
/* Build only the list rows (search filters this, NOT the shell, so the search box is never rebuilt) */
function cmClientListHTML(){
  var q=SEARCH.toLowerCase();
  var list=CLIENTS.filter(function(c){
    if(q&&(String(c.name||'')+' '+String(c.email||'')).toLowerCase().indexOf(q)<0)return false;
    var p=PLANS[c.id]||{};
    if(FILTER==='active')return !p.archived;
    if(FILTER==='archived')return !!p.archived;
    if(FILTER==='due'){var st=p.status||{};return st.nutrition==='overdue'||st.training==='overdue';}
    return true;
  }).sort(function(a,b){return String(a.name||'').toLowerCase()<String(b.name||'').toLowerCase()?-1:1;});
  return list.length?list.map(function(c){
    var badges=clientStatus(c).map(function(b){return '<span class="cm-b '+b[0]+'">'+b[1]+'</span>';}).join('');
    var p=PLANS[c.id]||{};var sub=(p.title||'Diet Plan')+((p.profile&&p.profile.goal)?(' · '+esc(p.profile.goal)):'');
    return '<button class="cm-cl" onclick="openClient(\''+c.id+'\')"><div class="cm-av">'+esc(initial(c.name||c.email))+'</div>'+
      '<div style="flex:1;min-width:0"><div class="cm-cl-nm">'+esc(c.name||c.email||'Client')+'</div><div class="cm-cl-sub">'+sub+'</div>'+(badges?'<div class="cm-badges">'+badges+'</div>':'')+'</div><span class="cm-go">›</span></button>';
  }).join(''):'<div class="empty">No clients match.</div>';
}
/* refresh just the list region — keeps the live search input (and the keyboard) intact while typing */
function cmFillList(){var h=$('cm-cl-list');if(h)h.innerHTML=cmClientListHTML();}
function cmSearchInput(v){SEARCH=v;clearTimeout(window._cs);window._cs=setTimeout(cmFillList,120);}
function renderClients(){
  var html='<div class="cm-top"><div class="cm-logo">S2S</div><div><div class="cm-title">Coach panel</div><div class="cm-sub">'+CLIENTS.length+' clients</div></div><span class="sp"></span><button class="cm-back" onclick="logout()">Sign out</button></div>'+
    '<div class="cm-body"><input id="cm-search" placeholder="🔍 Search clients…" value="'+esc(SEARCH)+'" autocomplete="off" oninput="cmSearchInput(this.value)">'+
    '<div class="cm-chips" id="cm-chips">'+
      [['all','All'],['active','Active'],['due',''+eicon('warn')+' Plan due'],['archived','Archived']].map(function(f){return '<button class="cm-chip'+(FILTER===f[0]?' on':'')+'" onclick="setFilter(\''+f[0]+'\')">'+f[1]+'</button>';}).join('')+
    '</div>'+

/* filter is a tap, not typing — update the chips + list in place (don't rebuild the search box) */
function setFilter(f){FILTER=f;
  try{var cs=$('cm-chips');if(cs){var order=['all','active','due','archived'];var btns=cs.querySelectorAll('.cm-chip');for(var i=0;i<btns.length;i++){btns[i].className='cm-chip'+(order[i]===f?' on':'');}}}catch(e){}
  cmFillList();
}

/* ========================= CLIENT DETAIL ========================= */
function openClient(id){
  CUR=CLIENTS.find(function(c){return c.id===id;})||{id:id,name:'Client'};
  CTAB='overview';CURPLAN=PLANS[id]||null;
  app('<div class="cm-top"><button class="cm-back" onclick="renderClients()">‹</button><div class="cm-title">'+esc(CUR.name||'Client')+'</div></div><div class="empty"><span class="spin"></span></div>');
  loadClientBundle(id).then(function(){renderClient();}).catch(function(e){
    renderClient(); toast('Some data could not load',true);
  });
}
function loadClientBundle(id){
  var today=todayISO(),from=addDays(today,-29);
  return Promise.all([
    api('getPlan',{clientId:id}).catch(function(){return CURPLAN||{};}),
    api('listLogs',{clientId:id,from:from,to:today}).catch(function(){return [];}),
    api('listJournal',{clientId:id}).catch(function(){return [];}),
    api('listWorkoutLogs',{clientId:id}).catch(function(){return [];}),
    api('listCheckins',{clientId:id,from:from,to:today}).catch(function(){return [];}),
    api('listComments',{clientId:id}).catch(function(){return [];}),
    api('listAssignments',{clientId:id}).catch(function(){return [];}),
    api('listCallLogs').catch(function(){return [];}),
    api('listProgress',{clientId:id}).catch(function(){return [];})
  ]).then(function(r){
    CURPLAN=r[0]||{};
    var calls=(r[7]||[]).filter(function(x){return x&&x.client_id===id;}).sort(function(a,b){return String(a.call_at||'')<String(b.call_at||'')?1:-1;});
    CACHE[id]={plan:r[0]||{},logs:r[1]||[],journal:r[2]||[],workouts:r[3]||[],checkins:r[4]||[],comments:r[5]||[],tasks:r[6]||[],calls:calls,progress:(r[8]||[])};
  });
}
function cur(){return CACHE[CUR.id]||{plan:{},logs:[],journal:[],workouts:[],checkins:[],comments:[],tasks:[],calls:[],progress:[]};}

function weightLog(){var m=(CURPLAN&&CURPLAN.milestones)||{};var w=m.weightLog||(m.weight&&m.weight.log)||[];return (Array.isArray(w)?w:[]).slice().filter(function(e){return e&&e.value!=null;}).sort(function(a,b){return String(a.date)<String(b.date)?-1:1;});}

function overviewHTML(){
  var d=cur();var today=todayISO();
  var wl=weightLog();var last=wl[wl.length-1],prev=wl.length>1?wl[wl.length-2]:null;
  var wDelta=(last&&prev)?round((num(last.value)-num(prev.value))*10)/10:null;
  // today's intake = journal nutrition for today + any log item cals (best-effort)
  var jToday=(d.journal||[]).filter(function(e){return String(e.date||'').slice(0,10)===today&&e.nutrition;});
  var logToday=(d.logs||[]).filter(function(l){return String(l.log_date||'').slice(0,10)===today;});
  var tot=sumNutr(jToday.map(function(e){return e.nutrition;}));
  logToday.forEach(function(l){var s=sumNutr(l.items);tot.cal+=s.cal;tot.p+=s.p;tot.c+=s.c;tot.f+=s.f;});
  var lastCk=(d.checkins||[]).filter(function(x){return x.kind!=='booking';}).slice().sort(function(a,b){return String(a.date)<String(b.date)?1:-1;})[0];
  var prof=(CURPLAN&&CURPLAN.profile)||{};
  var qa='<div class="cm-qa">'+[['💬','Message','openChat()'],['⚖','Log weight','openLogWeight()'],['✅','Add task','openAddTask()'],['📈','Progress','openLogProgress()']].map(function(a){return '<button class="cm-qab" onclick="'+a[2]+'"><span class="i">'+a[0]+'</span><span class="t">'+a[1]+'</span></button>';}).join('')+'</div>';
  var stats='<div class="cm-stat">'+
    '<div class="cm-st"><div class="k">Weight</div><div class="v">'+(last?round(num(last.value)*10)/10+' kg':'—')+'</div><div class="d"'+(wDelta!=null?(' style="color:'+(wDelta<0?'var(--good)':wDelta>0?'var(--crit)':'var(--muted)')+'"'):'')+'>'+(wDelta!=null?((wDelta<0?'▼ ':wDelta>0?'▲ +':'')+Math.abs(wDelta)+' kg since last'):'no weigh-ins')+'</div></div>'+
    '<div class="cm-st"><div class="k">Logged today</div><div class="v">'+(tot.cal?round(tot.cal).toLocaleString():'—')+'</div><div class="d">'+(tot.cal?('kcal · '+round(tot.p)+'P '+round(tot.c)+'C '+round(tot.f)+'F'):'nothing logged yet')+'</div></div>'+
    '<div class="cm-st"><div class="k">Last check-in</div><div class="v" style="font-size:16px;margin-top:6px">'+(lastCk?esc(fmtDate(lastCk.date)):'—')+'</div><div class="d">'+(lastCk?('compliance: '+esc(lastCk.compliance||'—')):'none yet')+'</div></div>'+
    '<div class="cm-st"><div class="k">Goal</div><div class="v" style="font-size:15px;margin-top:6px">'+esc(prof.goal||'—')+'</div><div class="d">'+esc(prof.duration||CURPLAN&&CURPLAN.title||'')+'</div></div>'+
  '</div>';
  var profCard='<div class="uline">Profile</div><div class="cm-ev">'+
    [['Email',CUR.email],['Start weight',prof.startWeight],['Current weight',prof.weight||(last&&last.value+' kg')],['Height',prof.height],['Diet',prof.diet],['Phone',prof.phone]]
     .filter(function(x){return x[1];}).map(function(x){return '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0"><span class="muted">'+x[0]+'</span><span style="font-weight:600;text-align:right">'+esc(x[1])+'</span></div>';}).join('')+
  '</div>';
  var open=d.tasks&&d.tasks.filter(function(t){return t.status!=='done';}).length;
  var tasksLine=open?('<div class="pill crit" style="display:block;text-align:center;margin-top:10px">'+eicon('check')+' '+open+' open task'+(open===1?'':'s')+' — see the Activity tab chart below</div>'):'';
  var wkoBtn='<button class="btn" style="margin:2px 0 8px" onclick="wkOpen()">'+eicon('dumbbell')+' Log a workout for '+esc((CUR.name||'client').split(' ')[0])+'</button>';
  var _sv=wkLoadSaved(CUR.id);
  var resumeBtn=(_sv&&_sv.wk&&wkHasProgress(_sv.wk))?('<button class="btn" style="margin:2px 0 8px;background:var(--good);border-color:var(--good)" onclick="wkResume()">'+eicon('play')+' Resume “'+esc(_sv.wk.day_name||'workout')+'” · '+wkSavedPct(_sv.wk)+'% logged</button>'):'';
  var openBtn='<button class="btn ghost" style="margin:0 0 10px" onclick="openPortalEdit()">'+eicon('pencil')+' Open full profile to edit '+eicon('arrowup')+'</button>';
  return qa+resumeBtn+wkoBtn+openBtn+stats+profCard+tasksSection();
}
/* deep-link into the full Transformation Portal editor for this client (edit plans, progress, everything) */
function openPortalEdit(){if(!CUR)return;var u=PORTAL_URL+'#coach-edit='+encodeURIComponent(CUR.id);try{window.open(u,'_blank','noopener');}catch(e){location.href=u;}toast('Opening full profile in the portal…');}
function callDT(iso){iso=String(iso||'');var d=iso.slice(0,10),t=iso.slice(11,16);return (d?fmtDate(d):'')+(t?(' · '+t):'');}

function activityHTML(){
  var d=cur();var ev=[];
  (d.logs||[]).forEach(function(l){var items=l.items||[];if(!items.length)return;var s=sumNutr(items);ev.push({type:'log',date:String(l.log_date||'').slice(0,10),ms:Date.parse((l.updated_at||l.log_date)||0)||0,pk:String(l.log_date||'').slice(0,10),count:items.length,tot:s});});
  (d.journal||[]).forEach(function(j){ev.push({type:'journal',date:String(j.date||'').slice(0,10),ms:Date.parse(j.created_at||j.date||0)||0,j:j,pk:j.id});});
  weightLog().forEach(function(w){ev.push({type:'weight',date:String(w.date||'').slice(0,10),ms:Date.parse(w.date||0)||0,w:w});});
  (d.workouts||[]).forEach(function(w){ev.push({type:'workout',date:String(w.date||'').slice(0,10),ms:Date.parse(w.created_at||w.date||0)||0,w:w});});
  (d.checkins||[]).forEach(function(ck){if(ck.kind==='booking')return;ev.push({type:'checkin',date:String(ck.date||'').slice(0,10),ms:Date.parse(ck.created_at||ck.date||0)||0,ck:ck});});
  ev.sort(function(a,b){return (b.ms||0)-(a.ms||0)||(a.date<b.date?1:-1);});
  if(!ev.length)return '<div class="empty">No activity in the last 30 days.</div>';
  var cmap={};(d.comments||[]).forEach(function(c){var k=c.post_type+'|'+c.post_key;(cmap[k]=cmap[k]||[]).push(c);});
  var html='',lastDay=null,today=todayISO(),y=addDays(today,-1);
  ev.forEach(function(e){
    if(e.date!==lastDay){lastDay=e.date;html+='<div class="cm-day">'+(e.date===today?'Today':e.date===y?'Yesterday':esc(fmtDate(e.date)))+'</div>';}
    html+=evHTML(e,cmap);
  });
  return html;
}
function cmtBlock(postType,pk,list){
  list=list||[];
  var inner=list.slice().sort(function(a,b){return String(a.created_at)<String(b.created_at)?-1:1;}).map(function(c){
    var mine=(c.sender==='admin'||c.by==='admin'||c.author==='admin');
    var who=mine?'You':esc(safeName(c.sender_name)||CUR.name||'Member');
    return '<div class="c'+(mine?' me':'')+'"><b>'+who+'</b> '+esc(c.text||'')+'</div>';
  }).join('');
  var iid='ci_'+postType+'_'+String(pk).replace(/[^a-z0-9]/gi,'');
  return '<div class="cm-cmt">'+inner+'<div class="cm-cmt-row"><input id="'+iid+'" placeholder="Reply…" onkeydown="if(event.key===\'Enter\')replyTo(\''+postType+'\',\''+esc(String(pk))+'\',\''+iid+'\')"><button onclick="replyTo(\''+postType+'\',\''+esc(String(pk))+'\',\''+iid+'\')">Send</button></div></div>';
}
function evHTML(e,cmap){
  if(e.type==='log'){
    return '<div class="cm-ev"><div class="cm-ev-h"><b>'+eicon('fork')+' Logged food</b><span>'+e.count+' item'+(e.count===1?'':'s')+(e.tot.cal?(' · ~'+round(e.tot.cal)+' kcal'):'')+'</span><span class="cm-ev-t">'+esc(fmtDate(e.date))+'</span></div>'+
      (e.tot.cal?'<div class="small muted">P '+round(e.tot.p)+' · C '+round(e.tot.c)+' · F '+round(e.tot.f)+'</div>':'')+
      cmtBlock('log',e.pk,cmap['log|'+e.pk])+'</div>';
  }
  if(e.type==='journal'){
    var j=e.j,n=j.nutrition||null;var ph=jPhoto(j);
    return '<div class="cm-ev"><div class="cm-ev-h"><b>'+eicon('camera')+' Journaled</b><span>'+esc((n&&n.name)||j.description||'meal')+(j.meal?(' · '+esc(j.meal)):'')+'</span><span class="cm-ev-t">'+esc(j.time||fmtDate(e.date))+'</span></div>'+
      '<div style="display:flex;gap:10px">'+(ph?'<img class="cm-thumb" src="'+esc(ph)+'">':'')+'<div style="min-width:0;flex:1">'+(n?'<div class="small" style="font-weight:600">'+round(n.cal)+' kcal · '+round(n.p)+'P '+round(n.c)+'C '+round(n.f)+'F</div>':'')+(j.description?'<div class="small muted" style="font-style:italic;margin-top:3px">“'+esc(j.description)+'”</div>':'')+'</div></div>'+
      cmtBlock('journal',j.id,cmap['journal|'+j.id])+'</div>';
  }
  if(e.type==='weight'){
    return '<div class="cm-ev"><div class="cm-ev-h"><b>'+eicon('weight')+' Weigh-in</b><span>'+(round(num(e.w.value)*10)/10)+' kg'+(e.w.note?(' · '+esc(e.w.note)):'')+'</span><span class="cm-ev-t">'+esc(e.w.time||fmtDate(e.date))+'</span></div></div>';
  }
  if(e.type==='workout'){

/* compact inline SVG line chart. series = [{label,color,pts:[{date,value}]}] (dates aligned across series) */
function cmChart(series,opts){
  opts=opts||{};series=(series||[]).map(function(s){return {label:s.label,color:s.color||'#E8170D',pts:(s.pts||[]).filter(function(p){return p&&p.date&&p.value!=null&&isFinite(+p.value);}).slice().sort(function(a,b){return a.date<b.date?-1:1;})};}).filter(function(s){return s.pts.length;});
  if(!series.length)return '<div class="small muted" style="padding:6px 2px 10px">Not enough data to chart yet.</div>';
  var W=320,H=132,pl=32,pr=12,pt=12,pb=22;
  var dset={};series.forEach(function(s){s.pts.forEach(function(p){dset[p.date]=1;});});
  var dates=Object.keys(dset).sort();var xi={};dates.forEach(function(d,i){xi[d]=i;});var n=dates.length;
  var vals=[];series.forEach(function(s){s.pts.forEach(function(p){vals.push(+p.value);});});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(opts.min!=null)mn=Math.min(mn,opts.min);if(mn===mx){mn-=1;mx+=1;}
  var iw=W-pl-pr,ih=H-pt-pb;
  var X=function(i){return pl+(n<=1?iw/2:i*(iw/(n-1)));};var Y=function(v){return pt+ih-((v-mn)/(mx-mn))*ih;};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">';
  [mx,(mn+mx)/2,mn].forEach(function(gv){var gy=Y(gv);svg+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--border)" stroke-width="1"/>';svg+='<text x="'+(pl-4)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" text-anchor="end" style="fill:var(--muted)">'+(Math.round(gv*10)/10)+'</text>';});
  series.forEach(function(s){var d=s.pts.map(function(p,i){return (i?'L':'M')+X(xi[p.date]).toFixed(1)+' '+Y(+p.value).toFixed(1);}).join(' ');
    svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.pts.forEach(function(p){svg+='<circle cx="'+X(xi[p.date]).toFixed(1)+'" cy="'+Y(+p.value).toFixed(1)+'" r="2.6" fill="'+s.color+'"/>';});});
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-size="9" text-anchor="start" style="fill:var(--muted)">'+esc(fmtDate(dates[0]))+'</text>';
  if(n>1)svg+='<text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="9" text-anchor="end" style="fill:var(--muted)">'+esc(fmtDate(dates[n-1]))+'</text>';
  svg+='</svg>';
  var legend=series.length>1?('<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:2px">'+series.map(function(s){return '<span class="small" style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:'+s.color+';display:inline-block"></i>'+esc(s.label||'')+'</span>';}).join('')+'</div>'):'';
  return '<div style="border:1px solid var(--border);border-radius:12px;background:var(--card2);padding:10px 10px 7px;margin-bottom:4px">'+svg+legend+'</div>';
}
/* unify measurement history across logs[].values + legacy per-key arrays → {key:[{date,value}]} */
function measSeries(m){
  var meas=(m&&m.measurements)||{};var by={};
  function add(k,date,v){if(v==null||v===''||!isFinite(+v)||!date)return;by[k]=by[k]||{};by[k][String(date).slice(0,10)]=+v;}
  if(Array.isArray(meas.logs))meas.logs.forEach(function(lg){var v=(lg&&lg.values)||{};Object.keys(v).forEach(function(k){add(k,lg.date,v[k]);});});
  Object.keys(meas).forEach(function(k){if(k==='logs')return;if(Array.isArray(meas[k]))meas[k].forEach(function(e){if(e&&e.value!=null)add(k,e.date,e.value);});});
  var out={};Object.keys(by).forEach(function(k){out[k]=Object.keys(by[k]).sort().map(function(d){return {date:d,value:by[k][d]};});});
  return out;
}

/* ========================= PROGRESS LOGGING (coach logs/updates every progress metric for the client) =========================
   Body composition · measurements · progress photos · weekly report · health markers — all written in the SAME shapes the
   portal/client use, so they reconcile everywhere. Milestone writes go through cmMergeMilestone (reload-fresh → mutate → save)
   so a client's concurrent edits are never clobbered. Photos upload via climbSignUpload; the weekly report uses saveProgress. */
function cmMergeMilestone(mutator){
  return api('getPlan',{clientId:CUR.id}).then(function(raw){raw=raw||{};var m=raw.milestones||{};mutator(m);
    return api('saveMilestones',{clientId:CUR.id,milestones:m}).then(function(){CURPLAN=CURPLAN||{};CURPLAN.milestones=m;return m;});});
}
function cmUpload(file,keyPrefix){
  var ext=(String(file.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
  return api('climbSignUpload',{clientId:CUR.id,key:(keyPrefix||'file')+'-'+Date.now(),ext:ext,contentType:file.type}).then(function(d){
    return new Promise(function(res,rej){var x=new XMLHttpRequest();x.open('PUT',d.signedUrl);x.setRequestHeader('content-type',file.type||'application/octet-stream');x.setRequestHeader('x-upsert','true');x.onload=function(){x.status<300?res({url:d.publicUrl,path:d.path}):rej(new Error('Upload failed ('+x.status+')'));};x.onerror=function(){rej(new Error('Network error'));};x.send(file);});
  });
}

/* ========================= WORKOUT RUNNER (coach logs a client's session) =========================
   Reads the client's training plan (new v2 workouts, or legacy training.days), lets the coach enter
   what the client actually did (reps/weight/… per set, tick off each set), then saves a workout log
   that is byte-for-byte compatible with the client's own runner — so it shows up in the client portal,
   the admin editor, and this app's Activity/Progress tabs, and marks the day done on the client's calendar. */
var WK=null, WK_START=0;
/* ── Resume support: an in-progress workout is checkpointed on-device per client, so closing the
   app (or tapping back) keeps it and the coach can resume from the client's profile where they left off. ── */
function wkPersistKey(cid){return 's2s_cm_wk_'+(cid||'');}
function wkPersist(){try{if(WK&&WK.client_id)localStorage.setItem(wkPersistKey(WK.client_id),JSON.stringify({wk:WK,start:WK_START,at:Date.now()}));}catch(e){}}
/* Debounced checkpoint — DON'T serialize+write the whole session to localStorage on every keystroke
   (that stalls/crashes the phone while typing); save ~0.8s after the last change instead. */
var WK_SAVE_T=null;
function wkPersistSoon(){try{if(WK_SAVE_T)clearTimeout(WK_SAVE_T);WK_SAVE_T=setTimeout(function(){WK_SAVE_T=null;wkPersist();},800);}catch(e){try{wkPersist();}catch(_){}}}

  var log={id:uid(),client_id:CUR.id,date:WK.date,day_id:WK.day_id||'',day_name:WK.day_name||'Workout',
    entries:entries.map(function(en){return {name:en.name||'Exercise',exId:en.exId||'',origName:en.origName||en.name||'',brand:en.brand||'',equipment:en.equipment||'',track:en.track,note:en.note||'',comment:en.comment||'',sec:en.sec||'',
      sets:en.sets.map(function(s){var o={done:!!s.done};(en.track||[]).forEach(function(v){o[v]=s[v]||'';});return o;})};}),
    summary:{totalSets:totalSets,totalReps:totalReps,volume:Math.round(volume),exercises:exs,note:(WK.note||''),loggedBy:(ME.name||'Coach'),by:'coach'},
    completion:completion,duration_sec:Math.max(0,Math.round((Date.now()-WK_START)/1000)),done:completion>=100};
  toast('Saving…');
  api('saveWorkoutLog',{log:log}).then(function(){
    var c=cur();c.workouts=c.workouts||[];c.workouts.unshift(log);
    wkClearSaved(CUR.id);WK=null;CTAB='activity';renderClient();
    toast('Workout logged ✓ '+totalSets+' set'+(totalSets===1?'':'s')+' · '+round(volume).toLocaleString()+' kg');
  }).catch(function(e){toast((e&&e.message)||'Could not save',true);});
}

/* ========================= CHAT ========================= */
function openChat(){
  var id=CUR.id;cmFabShow(false);
  app('<div class="cm-top"><button class="cm-back" onclick="renderClient()">‹</button><div class="cm-av sm">'+esc(initial(CUR.name||CUR.email))+'</div><div style="flex:1;min-width:0"><div class="cm-title" style="font-size:16px">'+esc(CUR.name||'Client')+'</div><div class="cm-sub">Chat</div></div></div><div class="cm-body" id="chat-body"><div class="empty"><span class="spin"></span></div></div>');
  api('listMessages',{clientId:id}).then(function(msgs){renderChat(msgs||[]);}).catch(function(e){$('chat-body').innerHTML='<div class="empty">Could not load messages.</div>';});
}
function renderChat(msgs){
  var html='<div class="cm-msgs">'+(msgs.length?msgs.map(function(m){
    var mine=(m.sender==='admin');
    return '<div class="cm-msg '+(mine?'me':'them')+'">'+(!mine?'<b style="font-size:11px;opacity:.75">'+esc(safeName(m.sender_name)||CUR.name||'Member')+'</b><br>':'')+esc(m.text||'')+'<div class="t">'+ago(m.created_at)+'</div></div>';
  }).join(''):'<div class="empty">No messages yet — say hello</div>')+'</div>';
  var cb=$('chat-body');if(cb)cb.innerHTML=html;
  // sticky composer at the very bottom of the app
  var old=$('chat-composer');if(old)old.remove();
  var comp=document.createElement('div');comp.id='chat-composer';comp.className='cm-composer';comp.style.maxWidth='460px';comp.style.margin='0 auto';comp.style.padding='10px 14px calc(10px + env(safe-area-inset-bottom))';
  comp.innerHTML='<input id="chat-in" placeholder="Message '+esc((CUR.name||'client').split(' ')[0])+'…" onkeydown="if(event.key===\'Enter\')sendChat()"><button onclick="sendChat()">Send</button>';
  $('app').appendChild(comp);
  if(cb)cb.scrollTop=cb.scrollHeight;window.scrollTo(0,document.body.scrollHeight);
}
function sendChat(){
  var el=$('chat-in');var txt=((el&&el.value)||'').trim();if(!txt)return;el.value='';
  api('sendMessage',{clientId:CUR.id,text:txt,media:null}).then(function(){
    api('listMessages',{clientId:CUR.id}).then(function(m){renderChat(m||[]);});
  }).catch(function(e){toast((e&&e.message)||'Could not send',true);if(el)el.value=txt;});
}

/* ========================= floating chat widget (global inbox) ========================= */
var CMCHAT_THREADS=[], CMCHAT_POLL=null;
function cmChatInit(){
  if($('cmfab')||!TOKEN)return;
  var b=document.createElement('button');
  b.id='cmfab';b.className='cmfab';b.title='Messages';b.setAttribute('aria-label','Messages');
  b.onclick=cmChatOpen;
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="cmfab-badge" id="cmfab-badge" style="display:none">0</span>';
  document.body.appendChild(b);
  cmChatPoll();
  if(CMCHAT_POLL)clearInterval(CMCHAT_POLL);
  CMCHAT_POLL=setInterval(cmChatPoll,45000);
}
function cmChatDestroy(){var b=$('cmfab');if(b)b.remove();if(CMCHAT_POLL){clearInterval(CMCHAT_POLL);CMCHAT_POLL=null;}cmChatClose();}
function cmFabShow(show){var b=$('cmfab');if(b)b.style.display=show?'':'none';}
function cmChatPoll(){
  if(!TOKEN)return;
  api('chatUnread').then(function(d){
    var total=(d&&d.total)||0;var b=$('cmfab'),badge=$('cmfab-badge');if(!b)return;
    if(total>0){b.classList.add('pulse');if(badge){badge.textContent=total>99?'99+':total;badge.style.display='';}}
    else{b.classList.remove('pulse');if(badge)badge.style.display='none';}
  }).catch(function(){});
}
function cmChatName(id){var c=CLIENTS.find(function(x){return x.id===id;});return (c&&(c.name||c.email))||'Client';}
function cmChatOpen(){
  if($('cmchat-ov'))return;
  var ov=document.createElement('div');ov.className='cmchat-ov';ov.id='cmchat-ov';
  ov.onclick=function(e){if(e.target===ov)cmChatClose();};
  ov.innerHTML='<div class="cmchat-panel">'+
    '<div class="cmchat-hd"><h3>Messages</h3><button class="cmchat-x" onclick="cmChatClose()" aria-label="Close">×</button></div>'+
    '<input class="cmchat-search" id="cmchat-q" placeholder="Search clients…" oninput="cmChatFilter(this.value)" autocomplete="off">'+
    '<div class="cmchat-list" id="cmchat-list"><div class="empty"><span class="spin"></span></div></div></div>';
  document.body.appendChild(ov);
  api('chatThreads').then(function(t){
    CMCHAT_THREADS=(t||[]).slice().sort(function(a,b){return String(a.last_at||'')<String(b.last_at||'')?1:-1;});
    cmChatRenderList('');
  }).catch(function(){var l=$('cmchat-list');if(l)l.innerHTML='<div class="empty">Could not load messages.</div>';});
}
function cmChatClose(){var ov=$('cmchat-ov');if(ov)ov.remove();}
function cmChatFilter(v){cmChatRenderList(v);}
function cmChatRenderList(q){
  var l=$('cmchat-list');if(!l)return;q=(q||'').toLowerCase();
  var rows=CMCHAT_THREADS.filter(function(t){if(!q)return true;return cmChatName(t.client_id).toLowerCase().indexOf(q)>=0;});
  if(!rows.length){l.innerHTML='<div class="empty" style="padding:30px 16px">'+(q?'No clients match.':'No conversations yet.')+'</div>';return;}
  l.innerHTML=rows.map(function(t){
    var nm=cmChatName(t.client_id);var un=t.unread||0;
    var prev=(t.last_sender==='admin'?'You: ':'')+(t.last_text||'');
    return '<button class="cmchat-row'+(un?' unread':'')+'" onclick="cmChatOpenFor(\''+t.client_id+'\')">'+
      '<div class="cm-av">'+esc(initial(nm))+'</div>'+
      '<div class="cmchat-main"><div class="cmchat-nm">'+esc(nm)+'</div><div class="cmchat-prev">'+esc(prev||'No messages yet')+'</div></div>'+
      '<div class="cmchat-meta"><span class="cmchat-when">'+ago(t.last_at)+'</span>'+(un?'<span class="cmchat-ubadge">'+(un>9?'9+':un)+'</span>':'')+'</div>'+
    '</button>';
  }).join('');
}
function cmChatOpenFor(id){
  cmChatClose();
  CUR=CLIENTS.find(function(c){return c.id===id;})||{id:id,name:cmChatName(id)};
  CURPLAN=PLANS[id]||null;
  loadClientBundle(id).catch(function(){});   /* warm the bundle so "back" lands on a full profile */
  openChat();
  api('markChatRead',{clientId:id}).then(function(){cmChatPoll();}).catch(function(){});
}

/* ========================= boot ========================= */
(function(){ if(TOKEN){ loadClients(); } else { renderLogin(); } })();
</script>
