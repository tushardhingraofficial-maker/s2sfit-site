/* ===== S2S Coach Mobile — standalone coach panel. Talks to the SAME super-api as the client portal. ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;width:100%;box-sizing:border-box}
input:focus,select,textarea:focus{outline:none;border-color:var(--red)}
.btn{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.03em;border:0;border-radius:11px;background:var(--red);color:#fff;padding:13px;font-size:15px;width:100%;cursor:pointer}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn:active{transform:scale(.99)}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* clients */

.cm-qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 6px}
.cm-qab{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--border);border-radius:13px;background:var(--card2);padding:11px 4px;cursor:pointer;text-align:center}

.cm-stat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 6px}
.cm-st{border:1px solid var(--border);border-radius:13px;background:var(--card2);padding:11px 12px}
.cm-st .k{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cm-st .v{font-family:var(--disp);font-weight:900;font-size:21px;margin-top:2px}
.cm-st .d{font-size:11.5px;color:var(--muted)}
.cm-ev{border:1px solid var(--border);border-radius:13px;background:var(--surface);padding:11px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.cm-ev-h{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px;flex-wrap:wrap}
.cm-ev-h b{font-weight:800;font-family:var(--disp);font-size:14px}
.cm-ev-t{margin-left:auto;color:var(--muted);font-size:11px;flex:none}
.cm-day{font-family:var(--disp);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:11.5px;margin:12px 2px 6px}
.cm-cmt{margin-top:9px;border-top:1px solid var(--border);padding-top:8px}
.cm-cmt .c{font-size:12.5px;margin-bottom:5px}
.cm-cmt .c b{font-weight:800}
.cm-cmt .c.me{color:var(--prot)}
.cm-cmt-row{display:flex;gap:7px;margin-top:6px}
.cm-cmt-row input{flex:1;border-radius:20px;padding:9px 13px;font-size:14px}
.cm-cmt-row button{border:0;border-radius:20px;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:0 15px;flex:none}
.cm-thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--border);flex:none}
/* chat */
.cm-msgs{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.cm-msg{max-width:82%;padding:9px 13px;border-radius:15px;font-size:14px;line-height:1.45;word-break:break-word}
.cm-msg.them{align-self:flex-start;background:var(--card2);border:1px solid var(--border);border-bottom-left-radius:5px}
.cm-msg.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:5px}
.cm-msg .t{font-size:10px;opacity:.7;margin-top:3px}
.cm-composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
.cm-composer input{flex:1;border-radius:22px;padding:11px 16px}
.cm-composer button{border:0;border-radius:22px;background:var(--red);color:#fff;font-weight:800;padding:0 18px;flex:none}
/* modal */
.cm-modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.cm-sheet{width:100%;max-width:460px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.cm-sheet h3{font-family:var(--disp);font-size:19px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%}
.plan-day{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:9px;background:var(--card2)}
.plan-day h4{font-family:var(--disp);font-size:15px;margin-bottom:4px}
.tsk{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.tsk .cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.tsk.done .cb{background:var(--good);border-color:var(--good);color:#fff}
.tsk.done .ttl{text-decoration:line-through;color:var(--muted)}
</style>

<body>
<div id="app"><div class="empty"><span class="spin"></span></div></div>
<script>
/* ========================= config + tiny API layer ========================= */
var API_URL='https://iiaqezfiqkonajqqcrcj.supabase.co/functions/v1/super-api';
var ANON='sb_publishable_sNBfL6rf0cJwO2Sh8GSZqA_3hkEGkax';
/* the hosted Transformation Portal — tapping "Open full profile" deep-links into that client's editor (#coach-edit=<id>).
   Set it in ONE place: the <meta name="s2s-portal-url"> tag in the <head>. (Also overridable via ?portal=… or window.S2S_PORTAL_URL.) */
var PORTAL_URL=(function(){
  try{var mt=document.querySelector('meta[name="s2s-portal-url"]');if(mt&&mt.content&&mt.content.trim())return mt.content.trim();}catch(e){}
  try{var q=new URLSearchParams(location.search).get('portal');if(q)return q;}catch(e){}
  try{if(window.S2S_PORTAL_URL)return window.S2S_PORTAL_URL;}catch(e){}
  return 'https://s2sfit.com/diet-plan';
})();
var TOKEN=null;
try{TOKEN=localStorage.getItem('s2s_coach_tok')||null;}catch(e){}
function api(action,payload){
  var headers={'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON};
  return fetch(API_URL,{method:'POST',headers:headers,body:JSON.stringify(Object.assign({action:action,token:TOKEN},payload||{}))})
    .then(function(r){return r.json().then(function(j){ if(!r.ok||j.error) throw new Error(j.error||('Request failed ('+r.status+')')); return j.data; });});
}
function overview(){
  var url=API_URL.replace(/\/[^\/]+$/,'/s2s-overview');
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({token:TOKEN})})
    .then(function(r){return r.json();}).then(function(j){return (j&&j.data)||j||{};}).catch(function(){return {};});
}
/* ========================= helpers ========================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function app(h){$('app').innerHTML=h;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowHM(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function num(v){var n=Number(v);return isFinite(n)?n:0;}
function fmtDate(iso){iso=String(iso||'').slice(0,10);if(!iso)return '';var d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function ago(iso){var t=Date.parse(iso||'');if(!t)return '';var s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';var m=s/60;if(m<60)return Math.floor(m)+'m ago';var h=m/60;if(h<24)return Math.floor(h)+'h ago';var dd=h/24;if(dd<7)return Math.floor(dd)+'d ago';return fmtDate(iso);}
function initial(s){return (String(s||'?').trim().charAt(0)||'?').toUpperCase();}
function toast(msg,bad){var t=document.createElement('div');t.className='toast';if(bad)t.style.background='var(--crit)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function calOf(t){t=t||{};if(t.cal!=null)return num(t.cal);return num(t.p)*4+num(t.c)*4+num(t.f)*9;}
function sumNutr(items){return (items||[]).reduce(function(a,it){a.cal+=num(it&&it.cal);a.p+=num(it&&it.p);a.c+=num(it&&it.c);a.f+=num(it&&it.f);return a;},{cal:0,p:0,c:0,f:0});}
function round(n){return Math.round(num(n));}
function kg(v){v=String(v||'').trim();if(!v)return 0;var m=v.match(/[\d.]+/);return m?num(m[0]):0;}

/* ========================= state ========================= */
var ME={name:'Coach'};         // signed-in coach (best-effort)
var CLIENTS=[], PLANS={}, FILTER='all', SEARCH='';
var CUR=null;                  // {id,name,email}
var CURPLAN=null, CTAB='overview';
var CACHE={};                  // per-client loaded bundles

/* ========================= AUTH ========================= */
function renderLogin(err,busy){
  app('<div class="cm-top"><div class="cm-logo">S2S</div><div><div class="cm-title">Coach panel</div><div class="cm-sub">mobile access</div></div></div>'+
    '<div class="cm-body" style="padding-top:40px">'+
      '<div style="text-align:center;margin-bottom:22px"><div class="cm-av" style="width:64px;height:64px;font-size:26px;margin:0 auto 10px">💪</div>'+
        '<div style="font-family:var(--disp);font-weight:900;font-size:24px">Welcome, Coach</div>'+
        '<div class="muted small">Sign in to view & manage your clients</div></div>'+
      '<div class="field"><label>Coach password</label><input id="cm-pw" type="password" placeholder="Your admin / coach password" autocomplete="current-password"></div>'+
      (err?'<div class="pill crit" style="display:block;text-align:center;margin-bottom:12px">'+esc(err)+'</div>':'')+
      '<button class="btn" id="cm-login" '+(busy?'disabled':'')+'>'+(busy?'Signing in…':'Sign in')+'</button>'+
      '<p class="small muted" style="margin-top:14px;text-align:center">Uses the same login as the S2S portal admin. Your session stays on this phone.</p>'+
      '<p class="small muted" style="margin-top:6px;text-align:center;opacity:.6">v'+esc((document.documentElement.getAttribute('data-version')||'')).toString()+'</p>'+
    '</div>');
  var inp=$('cm-pw');if(inp){inp.focus();inp.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});}
  var b=$('cm-login');if(b)b.onclick=doLogin;
}
function doLogin(){
  var pw=($('cm-pw')&&$('cm-pw').value||'').trim();
  if(!pw){renderLogin('Enter your password');return;}
  renderLogin('',true);
  api('adminLogin',{password:pw}).then(function(d){
    TOKEN=d&&d.token;if(!TOKEN)throw new Error('No session returned');
    try{localStorage.setItem('s2s_coach_tok',TOKEN);}catch(e){}
    loadClients();
  }).catch(function(e){renderLogin((e&&e.message)||'Wrong password');});
}
function logout(){TOKEN=null;try{localStorage.removeItem('s2s_coach_tok');}catch(e){}CLIENTS=[];PLANS={};CUR=null;renderLogin();}

/* ========================= CLIENTS LIST ========================= */
function loadClients(){
  app('<div class="cm-top"><div class="cm-logo">S2S</div><div><div class="cm-title">Coach panel</div><div class="cm-sub">loading…</div></div></div><div class="empty"><span class="spin"></span></div>');
  Promise.all([api('listClients').catch(function(){return [];}), overview()]).then(function(r){
    CLIENTS=(r[0]||[]).filter(Boolean);
    var ov=r[1]||{};PLANS={};
    (ov.plans||[]).forEach(function(p){if(p&&p.client_id)PLANS[p.client_id]=p;});
    renderClients();
  }).catch(function(e){
    if(/sign in|session|expired|token/i.test((e&&e.message)||'')){logout();return;}
    app('<div class="cm-top"><div class="cm-logo">S2S</div><div class="cm-title">Coach panel</div></div><div class="empty">Could not load clients.<br><button class="btn ghost" style="margin-top:14px;max-width:200px" onclick="loadClients()">Retry</button><br><button class="btn ghost" style="margin-top:8px;max-width:200px" onclick="logout()">Sign out</button></div>');
  });
}
function clientStatus(c){
  var p=PLANS[c.id]||{};var badges=[];
  if(p.archived)badges.push(['due','🗄 archived']);
  // plan-update overdue (from alloc dates + review cycle) — best effort
  try{var st=p.status||{};if(st.nutrition==='overdue'||st.training==='overdue')badges.push(['due','⚠ plan due']);}catch(e){}
  return badges;
}
function renderClients(){
  var q=SEARCH.toLowerCase();
  var list=CLIENTS.filter(function(c){
    if(q&&(String(c.name||'')+' '+String(c.email||'')).toLowerCase().indexOf(q)<0)return false;
    var p=PLANS[c.id]||{};
    if(FILTER==='active')return !p.archived;
    if(FILTER==='archived')return !!p.archived;
    if(FILTER==='due'){var st=p.status||{};return st.nutrition==='overdue'||st.training==='overdue';}
    return true;
  }).sort(function(a,b){return String(a.name||'').toLowerCase()<String(b.name||'').toLowerCase()?-1:1;});
  var html='<div class="cm-top"><div class="cm-logo">S2S</div><div><div class="cm-title">Coach panel</div><div class="cm-sub">'+CLIENTS.length+' clients</div></div><span class="sp"></span><button class="cm-back" onclick="logout()">Sign out</button></div>'+

/* compact inline SVG line chart. series = [{label,color,pts:[{date,value}]}] (dates aligned across series) */
function cmChart(series,opts){
  opts=opts||{};series=(series||[]).map(function(s){return {label:s.label,color:s.color||'#E8170D',pts:(s.pts||[]).filter(function(p){return p&&p.date&&p.value!=null&&isFinite(+p.value);}).slice().sort(function(a,b){return a.date<b.date?-1:1;})};}).filter(function(s){return s.pts.length;});
  if(!series.length)return '<div class="small muted" style="padding:6px 2px 10px">Not enough data to chart yet.</div>';
  var W=320,H=132,pl=32,pr=12,pt=12,pb=22;
  var dset={};series.forEach(function(s){s.pts.forEach(function(p){dset[p.date]=1;});});
  var dates=Object.keys(dset).sort();var xi={};dates.forEach(function(d,i){xi[d]=i;});var n=dates.length;
  var vals=[];series.forEach(function(s){s.pts.forEach(function(p){vals.push(+p.value);});});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(opts.min!=null)mn=Math.min(mn,opts.min);if(mn===mx){mn-=1;mx+=1;}
  var iw=W-pl-pr,ih=H-pt-pb;
  var X=function(i){return pl+(n<=1?iw/2:i*(iw/(n-1)));};var Y=function(v){return pt+ih-((v-mn)/(mx-mn))*ih;};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">';
  [mx,(mn+mx)/2,mn].forEach(function(gv){var gy=Y(gv);svg+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--border)" stroke-width="1"/>';svg+='<text x="'+(pl-4)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" text-anchor="end" style="fill:var(--muted)">'+(Math.round(gv*10)/10)+'</text>';});
  series.forEach(function(s){var d=s.pts.map(function(p,i){return (i?'L':'M')+X(xi[p.date]).toFixed(1)+' '+Y(+p.value).toFixed(1);}).join(' ');
    svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.pts.forEach(function(p){svg+='<circle cx="'+X(xi[p.date]).toFixed(1)+'" cy="'+Y(+p.value).toFixed(1)+'" r="2.6" fill="'+s.color+'"/>';});});
  svg+='<text x="'+pl+'" y="'+(H-6)+'" font-size="9" text-anchor="start" style="fill:var(--muted)">'+esc(fmtDate(dates[0]))+'</text>';
  if(n>1)svg+='<text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="9" text-anchor="end" style="fill:var(--muted)">'+esc(fmtDate(dates[n-1]))+'</text>';
  svg+='</svg>';
  var legend=series.length>1?('<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:2px">'+series.map(function(s){return '<span class="small" style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:'+s.color+';display:inline-block"></i>'+esc(s.label||'')+'</span>';}).join('')+'</div>'):'';
  return '<div style="border:1px solid var(--border);border-radius:12px;background:var(--card2);padding:10px 10px 7px;margin-bottom:4px">'+svg+legend+'</div>';
}
/* unify measurement history across logs[].values + legacy per-key arrays → {key:[{date,value}]} */
function measSeries(m){
  var meas=(m&&m.measurements)||{};var by={};
  function add(k,date,v){if(v==null||v===''||!isFinite(+v)||!date)return;by[k]=by[k]||{};by[k][String(date).slice(0,10)]=+v;}
  if(Array.isArray(meas.logs))meas.logs.forEach(function(lg){var v=(lg&&lg.values)||{};Object.keys(v).forEach(function(k){add(k,lg.date,v[k]);});});

/* training performance — volume trend, per-exercise estimated 1RM, best-lift list (from workout logs) */
function perfSection(){
  var ws=(cur().workouts||[]).filter(function(w){return w&&w.summary;}).slice().sort(function(a,b){return String(a.date||a.created_at||'')<String(b.date||b.created_at||'')?-1:1;});
  var out='<div class="uline">Training performance</div>';
  if(!ws.length)return out+'<div class="small muted" style="padding:4px 2px">No workouts logged yet.</div>';
  var totVol=0,compSum=0,compN=0;ws.forEach(function(w){totVol+=num(w.summary.volume);if(w.completion!=null){compSum+=num(w.completion);compN++;}});
  out+='<div class="cm-stat"><div class="cm-st"><div class="k">Sessions</div><div class="v">'+ws.length+'</div><div class="d">last '+esc(fmtDate(ws[ws.length-1].date||ws[ws.length-1].created_at))+'</div></div>'+
    '<div class="cm-st"><div class="k">Total volume</div><div class="v">'+round(totVol).toLocaleString()+'</div><div class="d">kg lifted'+(compN?(' · '+round(compSum/compN)+'% done avg'):'')+'</div></div></div>';
  var volPts=ws.map(function(w){return {date:String(w.date||w.created_at||'').slice(0,10),value:num(w.summary.volume)};});
  out+='<div class="small" style="font-weight:700;margin:6px 2px 3px">Volume per session (kg)</div>'+cmChart([{label:'Volume',color:'#15A34A',pts:volPts}]);
  var exMap={};ws.forEach(function(w){(w.summary.exercises||[]).forEach(function(ex){if(!ex||!ex.name||!(num(ex.est1rm)>0))return;(exMap[ex.name]=exMap[ex.name]||[]).push({date:String(w.date||w.created_at||'').slice(0,10),value:num(ex.est1rm)});});});
  var exNames=Object.keys(exMap);
  if(exNames.length){
    exNames.sort(function(a,b){return exMap[b].length-exMap[a].length;});var top=exNames[0];
    if(exMap[top].length>=2)out+='<div class="small" style="font-weight:700;margin:10px 2px 3px">Est. 1RM · '+esc(top)+' (kg)</div>'+cmChart([{label:top,color:'#2F7FD1',pts:exMap[top]}]);
    var best=exNames.map(function(k){return {name:k,best:exMap[k].reduce(function(mx,p){return Math.max(mx,p.value);},0)};}).sort(function(a,b){return b.best-a.best;}).slice(0,12);
    out+='<div class="small" style="font-weight:700;margin:12px 2px 4px">Best estimated 1RM by exercise</div><div class="cm-ev">'+best.map(function(x){return '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0"><span class="muted" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.name)+'</span><span style="font-weight:700;flex:none">'+round(x.best)+' kg</span></div>';}).join('')+'</div>';
  }
  return out;
}

  if(cb)cb.scrollTop=cb.scrollHeight;window.scrollTo(0,document.body.scrollHeight);
}
function sendChat(){
  var el=$('chat-in');var txt=((el&&el.value)||'').trim();if(!txt)return;el.value='';
  api('sendMessage',{clientId:CUR.id,text:txt,media:null}).then(function(){
    api('listMessages',{clientId:CUR.id}).then(function(m){renderChat(m||[]);});
  }).catch(function(e){toast((e&&e.message)||'Could not send',true);if(el)el.value=txt;});
}

/* ========================= boot ========================= */
(function(){ if(TOKEN){ loadClients(); } else { renderLogin(); } })();
</script>
