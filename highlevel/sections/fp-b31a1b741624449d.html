<!DOCTYPE html>
<html lang="en-AU" data-version="2026-11-23-1000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>S2S Financial Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#E8170D; --red-hover:#C81209; --accent:#D4537E;
  --ink:#111111; --surface:#1A1A1A; --card:#222222; --card2:#272727;
  --border:#2E2E2E; --line-strong:#3B3B3A; --text:#F2EFEA; --muted:#999690; --faint:#333333;
  --green:#22c55e; --gold:#f5c842; --crit:#FF6B5E;
  --biz:#4A9EE8; --pers:#F5A623; --fam:#D4537E;
  --radius:10px; --radius-lg:14px;
  --sans:'Barlow',system-ui,-apple-system,sans-serif;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
  --glow:0 2px 18px rgba(232,23,13,.44);
  color-scheme:dark;
}
html{height:100%}
body{min-height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.tnum,.num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 90px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;font-family:var(--disp)}
.muted{color:var(--muted)} .pos{color:var(--green)} .neg{color:var(--crit)}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(17,17,17,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-tile{width:34px;height:34px;border-radius:9px;background:var(--red);box-shadow:var(--glow);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:19px;color:#fff}
.brand-name{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand-name small{display:block;font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:700;margin-top:3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding:9px 14px;border-radius:9px;background:none;border:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--red);color:#fff;box-shadow:var(--glow)}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filters select{width:auto;padding:7px 10px;font-size:12.5px}
.tabs{order:3;flex:1 0 100%}
.filters{margin-left:auto}
.daynav{font-size:20px;line-height:1;padding:5px 13px}
.hscore{text-align:right;line-height:1.1}
.hscore b{display:block;font-family:var(--disp);font-size:38px;font-weight:900;color:var(--hc)}
.hscore span{font-family:var(--disp);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--hc)}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.hrow:last-child{border-bottom:none;padding-bottom:0}
.hrow .bd{flex:1;min-width:0}
.hdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line-strong)}
.hdot.good{background:var(--green)}.hdot.watch{background:var(--gold)}.hdot.poor{background:var(--crit)}
.hval{font-family:var(--disp);font-size:20px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.hval.good{color:var(--green)}.hval.watch{color:var(--gold)}.hval.poor{color:var(--crit)}.hval.na{color:var(--muted)}
.sec-title{font-size:24px;font-weight:900}
.xcol{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:4px 14px 14px;min-width:0}
.xcol .sec-h{border-top:none;margin-top:10px;padding-top:0;padding-bottom:10px;border-bottom:1px solid var(--line-strong)}
.xrow{padding:13px 0;border-bottom:1px solid var(--border)}
.xrow:last-child{border-bottom:none;padding-bottom:0}
.xrow-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:3px}
.xrow-h .amt{font-family:var(--disp);font-size:22px;font-weight:800;color:#ff8a80;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.xcol td .nm-sub,.xcol .nm-sub{min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line-strong)}
.sec-h h3{font-size:18px;color:var(--red)}
.sec-h .sub{font-size:12.5px;color:var(--muted)}
.sec-t{font-family:var(--disp);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-t span{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted)}
.bal-tot{font-family:var(--disp);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi.click{cursor:pointer;transition:border-color .12s,transform .12s}
.kpi.click:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.kchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.kchip{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--card2);color:var(--muted);white-space:nowrap}
.kchip.g{background:rgba(34,197,94,.13);color:var(--green)}
.kchip.b{background:rgba(255,107,94,.13);color:var(--crit)}
.kmore{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.kpi.click:hover .kmore{color:var(--red)}
.simnote{font-size:12px;color:var(--muted);margin-top:5px;font-style:italic}
.simnote a{color:var(--muted);text-decoration:underline;cursor:pointer;font-style:normal}
.simnote a:hover{color:var(--text)}

.btn{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:var(--radius);cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--red);color:#fff;padding:11px 20px;font-size:14px;box-shadow:var(--glow)}
.btn-primary:hover{background:var(--red-hover)}
.btn-ghost{background:var(--card);color:var(--text);border:2px solid var(--border);padding:9px 16px;font-size:13px}
.btn-ghost:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.btn-sm:hover{border-color:var(--red);color:var(--red)}
.btn-sm.solid{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm.ok{border-color:var(--green);color:var(--green)}
.btn-sm.danger:hover{border-color:var(--crit);color:var(--crit)}
.icon-x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:4px 8px}
.icon-x:hover{color:var(--red)}

input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
input[type="date"]{-webkit-min-logical-width:0;min-width:0;max-width:100%}
input[type="checkbox"]{width:17px;height:17px;padding:0;accent-color:var(--red);flex:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(232,23,13,.18)}
label.lbl{display:block;font-family:var(--disp);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.field{min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}

.chip{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:rgba(232,23,13,.14);border-color:var(--red);color:#ff8078}
.pill{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:20px;white-space:nowrap;font-family:var(--disp);background:var(--card2);color:var(--muted)}
.pill.business{background:rgba(74,158,232,.15);color:var(--biz)}
.pill.personal{background:rgba(245,166,35,.15);color:var(--pers)}
.pill.family{background:rgba(212,83,126,.17);color:#ee86aa}
.pill.planned{background:none;border:1px dashed var(--line-strong);color:var(--muted)}
.pill.over{background:rgba(255,107,94,.15);color:var(--crit)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:17px;font-weight:800;margin-bottom:2px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
@media(max-width:860px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.page-h h1{font-size:34px;font-weight:900;line-height:1}
.page-h p{color:var(--muted);font-size:13.5px;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 15px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--line-strong))}
.kpi .k{font-family:var(--disp);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--disp);font-size:28px;font-weight:800;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--disp);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.num{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tscroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.nm{font-weight:600}
td .nm-sub{min-width:270px}
.nm-sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prog{height:6px;border-radius:6px;background:var(--faint);overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--green);border-radius:6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}

.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-row .dt{flex:none;width:46px;text-align:center;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:4px 0;line-height:1.1}
.list-row .dt b{display:block;font-family:var(--disp);font-size:19px;font-weight:800}
.list-row .dt span{font-family:var(--disp);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.list-row .bd{flex:1;min-width:0}
.list-row .amt,td.money{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.01em;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.list-row .amt.out,td.money.out{color:#ff8a80}
.list-row .amt.pos,td.money.pos{color:var(--green)}
.list-row .amt{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:3px 11px;min-width:92px;text-align:right}
.tag{font-family:var(--disp);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:20px;white-space:nowrap;background:var(--card2);color:var(--muted);border:1px solid var(--border);cursor:pointer;transition:border-color .12s,color .12s}
.tag:hover{border-color:var(--text);color:var(--text)}
.tag i{font-style:normal;opacity:.6;font-size:9px}
.tag.business{background:rgba(74,158,232,.15);color:var(--biz);border-color:transparent}
.tag.personal{background:rgba(245,166,35,.15);color:var(--pers);border-color:transparent}
.tag.family{background:rgba(212,83,126,.17);color:#ee86aa;border-color:transparent}
.tag.on{background:rgba(34,197,94,.13);color:var(--green);border-color:transparent}
.tag.warn{background:rgba(245,200,66,.13);color:var(--gold);border-color:transparent}
.tag.off{background:none;color:var(--muted);opacity:.75}
input.search{width:230px;flex:0 1 230px;padding:8px 12px;font-size:13.5px;border-radius:20px}
.search-card{margin-bottom:16px;border-color:var(--red)}
@media(max-width:600px){input.search{flex:1 1 100%;width:100%}}
.bud{padding:13px 0;border-bottom:1px solid var(--border)}
.bud:last-child{border-bottom:none;padding-bottom:0}
.bud-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bud-amt{font-family:var(--disp);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bud-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.bud-f b{color:var(--text)}
.prog.two{display:flex;height:9px}
.prog.two i{border-radius:0}
.prog.two i.soft{opacity:.4}
.tag.add{background:none;border-style:dashed;border-color:var(--line-strong)}
.lab{display:inline-block;font-family:var(--disp);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:5px;border:none;margin-right:7px;vertical-align:2px;cursor:pointer;line-height:1.5}
.lab:hover{filter:brightness(1.15)}
#pop .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:9px;vertical-align:-1px}
.tag.planned{background:none;border-style:dashed;border-color:var(--line-strong)}
.tag.business:hover,.tag.personal:hover,.tag.family:hover,.tag.on:hover,.tag.warn:hover{border-color:currentColor}
#pop{position:fixed;z-index:400;display:none;min-width:190px;max-height:300px;overflow-y:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow);padding:5px}
#pop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:13.5px;padding:8px 11px;border-radius:7px;cursor:pointer}
#pop button:hover{background:var(--card2)}
#pop button.on{color:#ff8078;font-weight:600}
#pop button.on::after{content:" ✓"}
td.num{font-weight:600;font-size:13.5px}
.strike{text-decoration:line-through;opacity:.55}

.bars .b{margin-bottom:11px}
.bars .b-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:10px}
.bars .b-h span:last-child{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.bars .b-t{height:8px;background:var(--faint);border-radius:8px;overflow:hidden}
.bars .b-t i{display:block;height:100%;border-radius:8px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .zero{stroke:var(--line-strong);stroke-dasharray:4 4}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.chart .lb{fill:var(--muted);font-size:11px;font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chart rect.bar{transition:opacity .12s}
.chart rect.bar:hover{opacity:.75}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;width:16px;vertical-align:3px}
.chart-scroll{overflow-x:auto}
.chart-scroll .chart{min-width:560px}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-title{font-family:var(--disp);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;min-width:190px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--card2)}
.seg button{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;padding:7px 13px;border:none;background:none;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-family:var(--disp);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;padding:2px 0 4px}
.day{background:var(--card2);border:1px solid var(--border);border-radius:10px;min-height:112px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:border-color .12s}
.day:hover{border-color:var(--line-strong)}
.day.out{opacity:.38}
.day.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.day .dn{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1;display:flex;justify-content:space-between;align-items:center}
.day.today .dn b{background:var(--red);color:#fff;border-radius:6px;padding:2px 6px}
.day .dn span{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted)}
.ev{font-size:11.5px;line-height:1.25;padding:3px 6px;border-radius:6px;background:var(--card);border-left:3px solid var(--c,var(--muted));display:flex;justify-content:space-between;gap:6px;min-width:0}
.ev span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev span:last-child{font-family:var(--mono);font-size:11.5px;font-weight:700;flex:none;color:var(--text)}
.ev.inc{background:rgba(34,197,94,.1);border-left-color:var(--green)}
.ev.inc span:last-child{color:var(--green)}
.ev.planned{border:1px dashed var(--line-strong);border-left:3px dashed var(--c,var(--muted));background:none}
.ev.skipped{text-decoration:line-through;opacity:.45}
.ev.paid span:first-child::before{content:"✓ ";color:var(--green)}
.day .more{font-size:10.5px;color:var(--muted);padding-left:4px}
.day .tot{margin-top:auto;display:flex;justify-content:space-between;gap:4px;font-family:var(--mono);font-size:10.5px;padding-top:3px}
.cal.week .day{min-height:300px}
.cal.week .ev{flex-direction:column;gap:1px;font-size:12.5px;padding:6px 8px}
.cal.week .ev span:first-child{white-space:normal}
.cal.week .ev span:last-child{font-size:12px}

<script>
/* ============ state ============ */
const KEY='s2s_money_v1', DAY=864e5;
const SCOPES={business:{label:'Business',color:'#4A9EE8'},personal:{label:'Personal',color:'#F5A623'},family:{label:'Family',color:'#D4537E'}};
const MCOL=['#22c55e','#f5c842','#4A9EE8','#D4537E','#a78bfa','#2dd4bf'];
const TABS=[['overview','Overview'],['income','Income'],['expenses','Expenses'],['planner','Planner'],['invest','Investments'],['strategy','Strategy'],['tax','Tax &amp; P&amp;L'],['settings','Settings']];
const FREQ={once:'One-off',weekly:'Weekly',fortnightly:'Fortnightly',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly',custom:'Custom…'};
const blank=()=>({members:[{id:'m1',name:'Me'},{id:'m2',name:'Partner'}],labels:[],items:[],paid:{},skips:{},notDup:{},budgets:[],inv:[],accounts:[],strat:[],strategy:{},sales:[],bench:{},targets:[],settings:{currency:'AUD',balance:0,autoPaid:true,includePlanned:false,gstReg:true,medicare:true,medLow:28011}});
var LOCAL_ENC=null,VK=null;   // encrypted browser copy waiting for the password / the session key
let S=load(), T=todayN();
const UI={tab:'overview',scope:'all',member:'all',expView:'list',cal:T,showIncome:true,incRange:12,incGroup:'member',editId:null,editKind:null,dayOpen:null,fy:null,taxBasis:'sched',q:'',ov:'month',inv:'shares'};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.enc){LOCAL_ENC=d.enc;return blank()}if(d&&d.items){const b=blank();return Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{})})}}catch(e){}return blank()}
/* Past one-off transactions can be linked to a recurring item (it.partOf = its id). They stay on their real
   dates, and count toward that item's instalment count / total owed. Cache is rebuilt on every save and render. */
let LINK=null;
function links(id){if(!LINK){LINK={};S.items.forEach(i=>{if(i.partOf){const l=LINK[i.partOf]||(LINK[i.partOf]={n:0,amt:0});l.n++;l.amt+=+i.amount||0}})}return LINK[id]}
function save(){LINK=null;syncBal();storeLocal();cQueue()}

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const D=s=>{const[a,b,c]=s.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/DAY)};
const iso=n=>new Date(n*DAY).toISOString().slice(0,10);
function todayN(){const d=new Date();return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)}
const ymd=n=>{const d=new Date(n*DAY);return[d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()]};
const mk=(y,m,d)=>Math.round(Date.UTC(y,m,d)/DAY);
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const dow=n=>(new Date(n*DAY).getUTCDay()+6)%7;           // 0 = Monday
const weekStart=n=>n-dow(n);
function addMonths(n,k){const[y,m,d]=ymd(n);const t=y*12+m+k,yy=Math.floor(t/12),mm=t-yy*12;return mk(yy,mm,Math.min(d,dim(yy,mm)))}
const fd=(n,o)=>new Date(n*DAY).toLocaleDateString('en-AU',Object.assign({timeZone:'UTC'},o||{day:'numeric',month:'short',year:'numeric'}));
const fds=n=>fd(n,{day:'numeric',month:'short'});
function fm(v){v=+v||0;const whole=Math.abs(v-Math.round(v))<0.005;try{return new Intl.NumberFormat('en-AU',{style:'currency',currency:S.settings.currency||'AUD',minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2}).format(v)}catch(e){return '$'+v.toFixed(whole?0:2)}}
function short(v){const a=Math.abs(v),s=v<0?'-':'';return s+'$'+(a>=1e6?(a/1e6).toFixed(1)+'m':a>=1000?(a/1000).toFixed(a%1000?1:0)+'k':Math.round(a))}
const mName=id=>{const m=S.members.find(x=>x.id===id);return m?m.name:'—'};
const mColor=id=>MCOL[Math.max(0,S.members.findIndex(x=>x.id===id))%MCOL.length];
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

/* ============ schedule engine ============ */
function step(it){switch(it.freq){case'once':return null;case'weekly':return{n:1,u:'w'};case'fortnightly':return{n:2,u:'w'};case'monthly':return{n:1,u:'m'};case'quarterly':return{n:3,u:'m'};case'yearly':return{n:12,u:'m'};default:return{n:Math.max(1,Math.round(+it.everyN)||1),u:it.unit||'d'}}}
function nth(s,k,st){if(!st)return k?null:s;return st.u==='d'?s+k*st.n:st.u==='w'?s+k*7*st.n:addMonths(s,k*st.n)}
/* Every dated payment of an item between two days. Skipped dates don't count toward
   the instalment count or the total, so a total-based plan simply runs longer. */
function occs(it,from,to){
  const out=[];if(!it.start)return out;
  const st=step(it),s=D(it.start),amt=+it.amount||0;
  const endD=st&&it.endMode==='date'&&it.endDate?D(it.endDate):Infinity;
  const cnt=st&&it.endMode==='count'?Math.max(1,Math.round(+it.count)||1):Infinity;
  const tot=st&&it.endMode==='total'?Math.max(0,+it.total||0):Infinity;
  if(tot!==Infinity&&amt<=0)return out;
  const pre=links(it.id);let n=pre?pre.n:0,acc=pre?pre.amt:0;
  for(let k=0;k<3000;k++){
    const d=nth(s,k,st);if(d==null||d>endD||d>to)break;
    const key=it.id+'|'+iso(d);
    if(S.skips[key]){if(d>=from)out.push({it,d,key,amount:0,skipped:true});continue}
    if(n>=cnt)break;
    let a=amt;
    if(tot!==Infinity){const rem=tot-acc;if(rem<0.005)break;a=Math.min(amt,rem)}
    n++;acc+=a;
    if(d>=from)out.push({it,d,key,amount:a,idx:n});
  }
  return out;
}
const settled=o=>!!S.paid[o.key]||(S.settings.autoPaid&&o.d<T);
function info(it){
  const st=step(it),bounded=!!st&&!!it.endMode&&it.endMode!=='never';
  const list=occs(it,-1e9,bounded||!st?1e9:T+800).filter(o=>!o.skipped);
  let paid=0,paidN=0,rem=0,remN=0,next=null;
  for(const o of list){if(settled(o)){paid+=o.amount;paidN++}else{rem+=o.amount;remN++;if(!next)next=o}}
  const pre=links(it.id)||{n:0,amt:0};
  return{bounded,list,paid:paid+pre.amt,paidN:paidN+pre.n,rem,remN,next,last:list[list.length-1],total:paid+rem+pre.amt,n:list.length+pre.n,linked:pre.n};
}
function schedText(it){
  const st=step(it);if(!st)return'One-off';
  let t=it.freq==='custom'?'Every '+st.n+' '+({d:'day',w:'week',m:'month'}[st.u])+(st.n>1?'s':''):FREQ[it.freq];
  if(it.endMode==='count')t+=' × '+(Math.round(+it.count)||1);
  else if(it.endMode==='total')t+=' until '+fm(it.total)+' paid';
  else if(it.endMode==='date'&&it.endDate)t+=' until '+fd(D(it.endDate));
  return t;
}
function monthlyEq(it){const st=step(it);if(!st)return 0;const days=st.u==='d'?st.n:st.u==='w'?7*st.n:30.4375*st.n;return(+it.amount||0)*30.4375/days}
const vis=it=>(UI.scope==='all'||it.scope===UI.scope)&&(UI.member==='all'||it.member===UI.member)&&matchQ(it)&&(UI.tab!=='expenses'||expF(it));
function gather(o){
  let out=[];
  for(const it of S.items){
    if(o.kind&&it.kind!==o.kind)continue;
    if(!o.all&&!vis(it))continue;
    if(it.status==='planned'&&!o.planned)continue;
    out=out.concat(occs(it,o.from,o.to));
  }
  return out.sort((a,b)=>a.d-b.d);
}
/* future cash movements for the whole household (ignores the header filter) */
function flows(to){return gather({from:T,to,planned:S.settings.includePlanned,all:true}).filter(o=>!o.skipped&&!S.paid[o.key]).concat(budgetReserves(to),projOccs(T,to,true)).sort((a,b)=>a.d-b.d)}
function balAt(d,fl){let b=+S.settings.balance||0;for(const o of fl){if(o.d>d)break;b+=o.it.kind==='income'?o.amount:-o.amount}return b}
function forecast(months){
  const[y,m]=ymd(T);let bal=+S.settings.balance||0;const rows=[],fl=flows(mk(y,m+months,0));
  for(let i=0;i<months;i++){
    const a=i?mk(y,m+i,1):T,b=mk(y,m+i+1,0);let inc=0,exp=0;
    fl.forEach(o=>{if(o.d>=a&&o.d<=b){if(o.it.kind==='income')inc+=o.amount;else exp+=o.amount}});
    bal+=inc-exp;rows.push({a,b,inc,exp,net:inc-exp,bal});
  }
  return rows;
}

/* ============ charts ============ */
function nice(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return([1,1.2,1.6,2,2.4,3,4,5,6,8,10].find(s=>f<=s)||10)*p}
function chart(o){
  const W=820,H=o.h||260,sec=o.line&&!o.line.same,L=52,R=sec?58:14,Tp=14,B=30,pw=W-L-R,ph=H-Tp-B,n=o.labels.length;
  let mx=0;
  for(let i=0;i<n;i++)mx=Math.max(mx,o.stacked?sum(o.series,s=>s.values[i]):Math.max.apply(null,o.series.map(s=>s.values[i])));
  if(o.line&&o.line.same)mx=Math.max(mx,Math.max.apply(null,o.line.values));
  mx=nice(mx);

/* A budget sets an amount aside per week / month / quarter / financial year for one category.
   Every committed expense with that category counts against it; with "reserve" on, whatever is
   not yet spent or scheduled is held back in the forecast at the end of each period. */
const PERN={week:'week',month:'month',quarter:'quarter',year:'financial year'};
function periodOf(p,d){
  const[y,m]=ymd(d);
  if(p==='week'){const s=weekStart(d);return[s,s+6]}
  if(p==='quarter'){const q=m-m%3;return[mk(y,q,1),mk(y,q+3,0)]}
  if(p==='year'){const fy=m>=6?y:y-1;return[mk(fy,6,1),mk(fy+1,5,30)]}
  return[mk(y,m,1),mk(y,m+1,0)];
}
const inBudget=(b,it)=>it.kind==='expense'&&it.status!=='planned'&&(it.category||'').trim().toLowerCase()===(b.category||'').trim().toLowerCase()&&(!b.scope||b.scope==='any'||it.scope===b.scope);
function budgetOccs(b,from,to){let o=[];S.items.forEach(it=>{if(inBudget(b,it))o=o.concat(occs(it,from,to))});return o.filter(x=>!x.skipped)}
function periodShift(p,k){let[a,e]=periodOf(p,T);for(let i=0;i<Math.abs(k);i++){const n=periodOf(p,k<0?a-1:e+1);a=n[0];e=n[1]}return[a,e]}

  const[a,e]=off?periodShift(b.period,off):periodOf(b.period,T),o=budgetOccs(b,a,e),spent=sum(o.filter(x=>x.d<=T),x=>x.amount),coming=sum(o.filter(x=>x.d>T),x=>x.amount);
  return{a,e,spent,coming,left:b.amount-spent-coming};
}
function budgetReserves(to){
  const out=[];
  (S.budgets||[]).forEach(b=>{
    if(!b.reserve||!(b.amount>0))return;
    let[a,e]=periodOf(b.period,T);const all=budgetOccs(b,a,to);
    for(let g=0;g<400&&e<=to;g++){
      const rem=b.amount-sum(all.filter(x=>x.d>=a&&x.d<=e),x=>x.amount);
      if(rem>0.005)out.push({it:{id:'b_'+b.id,kind:'expense',name:'Budget: '+b.name,scope:'business'},d:e,key:'b|'+b.id+'|'+e,amount:rem,budget:true});
      [a,e]=periodOf(b.period,e+1);
    }
  });
  return out;
}

/* Similar-expense notes: a normal one-off expense gets a small text note when a recurring or a planned
   expense has the same amount and similar wording (or when it reads like one of the budgets).
   Nothing is highlighted and normal transactions are never compared with each other. */
let SIM={};
const STOPW=new Set(['the','and','pty','ltd','payment','pay','for','from','card','direct','debit','transfer','copy']);
const toks=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w.length>=3&&!STOPW.has(w));
function dice(a,b){
  if(a.length<2||b.length<2)return 0;
  const g=s=>{const m={};for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);m[k]=(m[k]||0)+1}return m},x=g(a),y=g(b);let n=0;
  for(const k in x)if(y[k])n+=Math.min(x[k],y[k]);
  return 2*n/(a.length+b.length-2);
}
function similar(a,b){
  const A=toks(a),B=toks(b);if(!A.length||!B.length)return false;
  for(const x of A)for(const y of B){const m=Math.min(x.length,y.length);if(x===y||(m>=4&&(x.indexOf(y)===0||y.indexOf(x)===0))||(m>=5&&dice(x,y)>=.7))return true}
  return dice(A.join(''),B.join(''))>=.6;
}
const dupKey=(a,b)=>[a,b].sort().join('|');
function simScan(){
  SIM={};
  const nd=S.notDup||{},ex=S.items.filter(i=>i.kind==='expense'),isRef=i=>i.freq!=='once'||i.status==='planned',refs=ex.filter(isRef);
  ex.forEach(it=>{
    if(isRef(it)||it.partOf)return;
    const r=refs.find(o=>!nd[dupKey(it.id,o.id)]&&Math.abs((+it.amount||0)-(+o.amount||0))<=0.005&&similar(it.name,o.name));
    if(r){SIM[it.id]={ref:r.id,text:'Similar to your '+(r.status==='planned'?'planned':'recurring')+' expense “'+r.name+'”'};return}
    const cat=(it.category||'').trim().toLowerCase();
    const b=(S.budgets||[]).find(x=>(x.category||'').trim().toLowerCase()!==cat&&(!x.scope||x.scope==='any'||x.scope===it.scope)&&!nd['bud|'+x.id+'|'+it.id]&&similar(it.name,x.name+' '+x.category));
    if(b)SIM[it.id]={bud:b.id,text:'Looks like “'+b.name+'” budget spend'};
  });
}
function simNote(it){
  if(it.partOf){const r=S.items.find(x=>x.id===it.partOf);return r?'<div class="simnote">Counted as part of your recurring “'+esc(r.name)+'” · <a onclick="event.stopPropagation();unlinkItem(\''+it.id+'\')">unlink</a></div>':''}
  const s=SIM[it.id];if(!s)return'';
  return'<div class="simnote">'+esc(s.text)+(s.ref?' · <a title="Choose how to merge these" onclick="event.stopPropagation();simMerge(event,\''+it.id+'\')">merge ▾</a>':'')+(s.bud?' · <a onclick="event.stopPropagation();budAdd(\''+s.bud+'\',\''+it.id+'\')">count it</a>':'')+' · <a title="Stop showing this note" onclick="event.stopPropagation();simHide(\''+it.id+'\')">hide</a></div>';
}
/* Merge choices for a "similar to…" note: treat the one-off as the scheduled payment itself (it is removed
   and that payment is marked paid), count it as an earlier payment of the recurring item, or keep it apart. */
function simMerge(ev,id){
  const it=S.items.find(x=>x.id===id),s=SIM[id];if(!it||!s||!s.ref)return;
  const r=S.items.find(x=>x.id===s.ref);if(!r)return;
  const d=D(it.start),once=r.freq==='once';
  const o=(once?occs(r,-1e9,1e9):occs(r,d-10,d+10)).filter(x=>!x.skipped&&!S.paid[x.key]).sort((a,b)=>Math.abs(a.d-d)-Math.abs(b.d-d))[0];
  const opts=[];
  if(o)opts.push(['Same payment as “'+r.name+'” due '+fds(o.d)+' — merge into it',null,false,'merge']);
  if(!once)opts.push(['Count it as an earlier payment of “'+r.name+'”',null,false,'link']);
  opts.push(['Keep them separate — hide this note',null,false,'hide']);
  popOpen(ev,opts,i=>{
    const a=opts[i][3];let msg='Kept separate';
    if(a==='merge'){
      if(r.status==='planned')r.status='active';
      if(once){r.start=it.start;S.paid[r.id+'|'+r.start]=1}else S.paid[o.key]=1;
      S.items=S.items.filter(x=>x.id!==id);dropKeys(id);msg='Merged into “'+r.name+'” and marked paid';
    }else if(a==='link'){it.partOf=r.id;msg='Counted as an earlier payment of “'+r.name+'”'}
    else(S.notDup=S.notDup||{})[dupKey(id,r.id)]=1;
    save();closePop();refresh();toast(msg);
  });
}

/* ============ richer stat tiles ============ */
/* kpiX is kpi() plus small percentage chips (change vs the previous period, share of income / of the
   total) and, when given the payments behind the number, a click-through breakdown (statOpen). */
let STAT=[];
const chg=(cur,prev)=>prev?(cur-prev)/Math.abs(prev):null;
const pct0=x=>Math.abs(x)<0.0005?'0%':Math.abs(x*100).toFixed(Math.abs(x)<0.1?1:0)+'%';
const chip=(t,tone)=>'<span class="kchip '+(tone||'')+'">'+t+'</span>';
/* change chip: goodUp says whether a rise is good news (income) or bad (expenses) */
function dchip(cur,prev,label,goodUp){const c=chg(cur,prev);if(c==null)return chip('no '+label+' to compare');const up=c>=0;return chip((up?'▲ ':'▼ ')+pct0(c)+' vs '+label,Math.abs(c)<0.005?'':up===!!goodUp?'g':'b')}
const share=(part,whole,label,tone)=>whole?chip(pct0(part/whole)+' of '+label,tone):'';
function kpiX(o){
  let i=-1;if(o.detail){STAT.push(o.detail);i=STAT.length-1}
  return'<div class="kpi'+(i>=0?' click':'')+'" style="--k:'+(o.c||'var(--line-strong)')+'"'+(i>=0?' onclick="statOpen('+i+')" title="Click for the full breakdown"':'')+'><div class="k">'+o.k+'</div><div class="v '+(o.cls||'')+'">'+o.v+'</div>'+(o.s?'<div class="s">'+o.s+'</div>':'')+
    (o.chips&&o.chips.filter(Boolean).length?'<div class="kchips">'+o.chips.filter(Boolean).join('')+'</div>':'')+(i>=0?'<div class="kmore">Breakdown ›</div>':'')+'</div>';
}
/* one breakdown table: amount, % of the total, % of a base figure (e.g. income), change vs the
   previous period, and size relative to the biggest row */
function brk(title,occ,prev,key,d){
  const m={},p={},total=sum(occ,o=>o.amount);
  occ.forEach(o=>{const k=key(o);m[k]=(m[k]||0)+o.amount});(prev||[]).forEach(o=>{const k=key(o);p[k]=(p[k]||0)+o.amount});
  const rows=Object.keys(m).map(k=>({k,v:m[k],p:p[k]||0})).sort((a,b)=>b.v-a.v),top=rows.slice(0,12),mx=top.length?top[0].v:1,rest=sum(rows.slice(12),r=>r.v);
  if(!top.length)return'';
  return'<h3 style="font-size:16px;margin:18px 0 6px">'+title+'</h3><div class="tscroll"><table><tr><th></th><th class="r">Amount</th><th class="r">% of total</th>'+(d.base?'<th class="r">% of '+d.baseLabel+'</th>':'')+(prev?'<th class="r">vs '+d.prevLabel+'</th>':'')+'<th>Relative to largest</th></tr>'+
    top.map(r=>{const c=chg(r.v,r.p);return'<tr><td class="nm">'+esc(r.k)+'</td><td class="r num">'+fm(r.v)+'</td><td class="r num">'+pct0(total?r.v/total:0)+'</td>'+(d.base?'<td class="r num">'+pct0(r.v/d.base)+'</td>':'')+
      (prev?'<td class="r num '+(c==null?'muted':(c>=0)===!!d.goodUp?'pos':'neg')+'">'+(c==null?'new':(c>=0?'▲ ':'▼ ')+pct0(c))+'<div class="nm-sub" style="justify-content:flex-end">'+(r.p?'was '+fm(r.p):'')+'</div></td>':'')+
      '<td style="min-width:130px"><div class="prog"><i style="width:'+(r.v/mx*100).toFixed(0)+'%;background:'+(d.goodUp?'var(--green)':'var(--red)')+'"></i></div><div class="nm-sub">'+(r.v/mx*100).toFixed(0)+'%</div></td></tr>'}).join('')+
    (rest?'<tr><td class="muted">'+(rows.length-12)+' more</td><td class="r num">'+fm(rest)+'</td><td class="r num">'+pct0(rest/total)+'</td><td colspan="3"></td></tr>':'')+'</table></div>';
}
function statOpen(i){
  const d=STAT[i];if(!d)return;
  const occ=d.occ.filter(o=>!o.skipped),prev=d.prev?d.prev.filter(o=>!o.skipped):null,total=sum(occ,o=>o.amount),ptotal=prev?sum(prev,o=>o.amount):null;

/* ============ income projection ============ */
/* Logged (one-off) income is projected forward from its recent pattern: the average per week over the
   last completed weeks, worked out separately for each person + group. S.settings.projWeeks is
   'auto' (up to 12 weeks, or as many as there is history for), 4, 8, 12 or 'off'. Regular income that

/* Australian resident individual rates. The second bracket is 16% to 30 Jun 2026, 15% for 2026-27, 14% from 1 Jul 2027. */
const gstOf=it=>it.gst||(it.scope==='business'?'inc':'free');
const dedOf=it=>it.deduct!=null&&it.deduct!==''?Math.min(100,Math.max(0,+it.deduct||0)):(it.scope==='business'?100:0);
const dedMode=it=>dedOf(it)>=100?'yes':dedOf(it)<=0?'no':'part';
const taxTypeOf=it=>it.taxType||(it.scope==='business'?'gross':'net');
function taxTable(fy){const r=fy>=2027?.14:fy>=2026?.15:.16;return[[18200,0],[45000,r],[135000,.3],[190000,.37],[Infinity,.45]]}
function incomeTax(ti,fy){
  ti=Math.max(0,ti);let t=0,prev=0;
  for(const[lim,r]of taxTable(fy)){if(ti>prev)t+=(Math.min(ti,lim)-prev)*r;prev=lim}
  const lito=Math.min(t,ti<=37500?700:ti<=45000?700-(ti-37500)*.05:ti<=66667?325-(ti-45000)*.015:0);
  const lo=+S.settings.medLow||0,med=S.settings.medicare&&ti>lo?Math.min((ti-lo)*.1,ti*.02):0;
  return{gross:t,lito,med,total:t-lito+med};
}
function taxCalc(from,to,scale){
  const c={rev:0,exp:0,gstOut:0,gstCr:0,cats:{},per:{},hhInc:{},hhExp:{}},reg=S.settings.gstReg;
  S.members.forEach(m=>c.per[m.id]={gross:0,ded:0,net:0,exempt:0});
  gather({from,to,all:true}).forEach(o=>{
    if(o.skipped)return;
    const it=o.it,a=o.amount*scale,g=reg&&gstOf(it)==='inc'?a/11:0,p=c.per[it.member]||(c.per[it.member]={gross:0,ded:0,net:0,exempt:0});
    if(it.kind==='income'){
      c.hhInc[it.scope]=(c.hhInc[it.scope]||0)+a;c.gstOut+=g;
      if(it.scope==='business')c.rev+=a-g;
      const tt=taxTypeOf(it);if(tt==='gross')p.gross+=a-g;else if(tt==='net')p.net+=a;else p.exempt+=a;
    }else{
      const d=dedOf(it)/100,cr=g*d;
      c.hhExp[it.scope]=(c.hhExp[it.scope]||0)+a;c.gstCr+=cr;p.ded+=(a-g)*d;
      if(it.scope==='business'){const k=it.category||'Uncategorised';c.cats[k]=(c.cats[k]||0)+a-cr;c.exp+=a-cr}
    }
  });
  return c;
}

let IMP=null;
function parseCSV(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'',dl=[',',';','\t'].reduce((a,b)=>first.split(b).length>first.split(a).length?b:a);

    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){row.push(cur);cur=''}

    else cur+=ch}

const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function pDate(s,fmt){
  const p=String(s||'').trim().split(/[T ]/)[0].length>=6&&/^\d/.test(s.trim())&&!/[a-z]/i.test(s)?String(s).trim().split(/[T ]/)[0].split(/[\/\-.]/):String(s||'').trim().split(/[\/\-., ]+/);
  if(p.length<3)return null;

  let y,m,d;
  if(/^\d{4}$/.test(p[0])){y=+p[0];m=num(p[1]);d=num(p[2])}
  else if(fmt==='mdy'&&!/[a-z]/i.test(p[1])){m=num(p[0]);d=num(p[1]);y=+p[2]}
  else if(/[a-z]/i.test(p[0])){m=num(p[0]);d=num(p[1]);y=+p[2]}
  else{d=num(p[0]);m=num(p[1]);y=+p[2]}

}
function pAmt(s){s=String(s==null?'':s).trim();if(!s)return NaN;const neg=/^\(.*\)$/.test(s)||/^[-−–]/.test(s)||/[-−]$/.test(s)||/\bDR$/i.test(s);const v=parseFloat(s.replace(/[^0-9.]/g,''));return isNaN(v)?NaN:neg?-v:v}
function csvPick(inp){

    const rows=parseCSV(String(r.result));if(rows.length<1){alert('That file has no rows to read.');return}
    const n=Math.max.apply(null,rows.map(x=>x.length)),h=rows[0],hasH=!h.some(x=>pDate(x,'dmy')!=null||(x.trim()!==''&&!isNaN(pAmt(x))&&/^[\s$()\-−.,\d]+$/.test(x)));
    const find=re=>hasH?h.findIndex(x=>re.test(x)):-1,body=rows.slice(hasH?1:0,40),col=f2=>{let best=-1,bs=0;for(let i=0;i<n;i++){const sc=sum(body,r2=>f2(r2[i]||'')?1:0);if(sc>bs){bs=sc;best=i}}return best};
    const m={date:find(/date/i),desc:find(/desc|narr|detail|memo|payee|particular|reference|transaction/i),amount:find(/amount|value/i),debit:find(/debit|withdraw|paid out|money out/i),credit:find(/credit|deposit|paid in|money in/i),cat:find(/categ/i)};

function impRows(){
  const m=IMP.map,have=new Set(S.items.filter(i=>i.freq==='once').map(i=>i.kind+'|'+i.start+'|'+(+i.amount).toFixed(2)+'|'+i.name.toLowerCase())),out=[],used={},refs=S.items.filter(i=>i.freq!=='once'||i.status==='planned');
  IMP.rows.forEach((r,i)=>{
    if(IMP.hasH&&!i)return;
    const d=m.date>=0?pDate(r[m.date],IMP.fmt):null,name=(m.desc>=0?r[m.desc]||'':'').trim().replace(/\s+/g,' ')||'Imported';
    let v=NaN,kind='expense';
    if(m.amount>=0){v=pAmt(r[m.amount]);kind=IMP.sign==='allexp'?'expense':IMP.sign==='allinc'?'income':(IMP.sign==='neg'?v<0:v>0)?'expense':'income'}
    else{const db=m.debit>=0?pAmt(r[m.debit]):NaN,cr=m.credit>=0?pAmt(r[m.credit]):NaN;if(db&&!isNaN(db)){v=db;kind='expense'}else if(cr&&!isNaN(cr)){v=cr;kind='income'}}

/* ============ encryption (vault) ============ */
/* Version 2 security. One slow key derivation (PBKDF2-SHA256, 600,000 rounds) turns the password into
   512 bits: the first half is the sign-in key sent to the cloud (it only proves who you are), the second
   half is an AES-256-GCM key that never leaves the device. The planner is encrypted with it before it is
   uploaded and before it is written to this browser's storage, so the cloud, the website host and anyone
   with the device's browser storage only ever see ciphertext. The AES key lives in memory, plus
   sessionStorage so a reload in the same tab stays open; closing the tab or locking forgets it. */

const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveV2(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(V2_SALT),iterations:V2_IT},base,512));
  return{auth:[...bits.subarray(0,32)].map(b=>b.toString(16).padStart(2,'0')).join(''),raw:bits.slice(32)};
}
async function setVK(raw){DKRAW=raw;VK=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);try{sessionStorage.setItem(VKEY,b64(raw))}catch(e){}}
function dropVK(){VK=null;DKRAW=null;try{sessionStorage.removeItem(VKEY)}catch(e){}}
async function encJSON(obj){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},VK,new TextEncoder().encode(JSON.stringify(obj))));return{v:2,iv:b64(iv),ct:b64(ct)}}
async function decJSON(e){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(e.iv)},VK,ub64(e.ct))))}
const merged=d=>{const b=blank();return Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{})})};

function pwCheck(p){
  const words=p.trim().split(/[\s\-_.]+/).filter(w=>w.length>=3).length,cls=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(p)).length;
  if(p.length<12)return{ok:false,msg:'At least 12 characters — four or five random words is easiest to remember'};
  if(/tushar|dhingra|s2s|fitness|password|planner|19\d\d|20\d\d/i.test(p))return{ok:false,msg:'Avoid names, years and words about you or the business'};
  if(p.length<16&&cls<3&&words<4)return{ok:false,msg:'Make it longer (16+), or mix upper case, numbers and symbols'};
  return{ok:true,msg:p.length>=20||words>=5?'Very strong':'Strong'};
}
function encCard(){
  const on=C.v===2;
  return'<div class="card" style="margin-bottom:16px"><div class="card-h"><div><h3>Encryption &amp; password</h3><div class="sub">'+(on?'<b class="pos">End-to-end encryption is ON.</b> Your planner is encrypted on this device before it is saved or synced. Nobody — not the website host, not the cloud database — can read it without your password.':'<b class="neg">Encryption is OFF.</b> Your cloud copy can currently be read by anyone who gets into the database. Turn it on below — it also replaces your password with a stronger one.')+'</div></div></div>'+
    (hasCrypto()?'':'<div class="alert">This browser cannot do the encryption (it needs a secure page). Open the planner from its web link to change this.</div>')+
    (!C.sk&&!on?'<p class="muted" style="font-size:13px">Turn cloud sync on first — encryption is set up together with your cloud copy.</p>':
    '<div class="row" style="margin:0;align-items:end"><div class="field"><label class="lbl">Current password</label><input type="password" id="ec-cur" autocomplete="current-password"></div>'+
      '<div class="field"><label class="lbl">New password</label><input type="password" id="ec-new" autocomplete="new-password" oninput="ecHint()"></div>'+
      '<div class="field"><label class="lbl">Repeat new password</label><input type="password" id="ec-new2" autocomplete="new-password"></div>'+
      '<div class="field"><button class="btn btn-primary" style="width:100%" '+(hasCrypto()?'':'disabled')+' onclick="encSetup()">'+(on?'Change password':'Encrypt &amp; change password')+'</button></div></div>'+
    (on?'<div class="preview" style="margin:14px 0 0;border-left-color:'+(C.wrap&&C.wrap.wr?'var(--green)':'var(--crit)')+'"><b>Recovery key</b><br>'+(C.wrap&&C.wrap.wr?'Set'+(C.wrap.rdate?' on '+fd(D(C.wrap.rdate)):'')+'. If you forget your password, use the link emailed to '+RECOVERY_EMAIL+', or “Forgot password?” on the lock screen.':'<span class="neg">None yet — make one so a forgotten password does not lock you out for good.</span>')+
      '<div class="row" style="margin:10px 0 0;align-items:end"><div class="field"><label class="lbl">Your password</label><input type="password" id="rk-pw" autocomplete="current-password"></div><div class="field"><button class="btn btn-ghost" style="width:100%" onclick="newRecovery()">'+(C.wrap&&C.wrap.wr?'Make a new recovery key':'Create recovery key')+'</button></div></div>'+
      (C.wrap&&C.wrap.wr?'<div class="nm-sub" style="margin-top:6px"><span>A new key replaces the old one — the old email link stops working.</span></div>':'')+'</div>':'')+
    '<div class="simnote" id="ec-hint" style="font-style:normal;margin-top:8px">Use four or five random words, e.g. “copper lantern orbit maple”. Write it down somewhere safe — if it is lost, the encrypted data cannot be recovered by anyone.</div>')+'</div>';
}
function ecHint(){const p=$('#ec-new').value,r=pwCheck(p);$('#ec-hint').innerHTML=p?'<span class="'+(r.ok?'pos':'neg')+'">'+r.msg+'</span>':''}
async function encSetup(){
  const cur=$('#ec-cur').value,nw=$('#ec-new').value,nw2=$('#ec-new2').value,r=pwCheck(nw),btn=document.activeElement;
  if(!r.ok){toast(r.msg);return}if(nw!==nw2){toast('The new passwords do not match');return}if(nw===cur){toast('Choose a different password');return}
  if(!C.sk){toast('Turn cloud sync on first');return}
  if(btn)btn.disabled=true;toast('Working — this takes a few seconds…');
  const oldVK=VK,oldRaw=DKRAW,oldWrap=C.wrap;
  const undo=async()=>{C.wrap=oldWrap;if(oldRaw)await setVK(oldRaw);else{VK=oldVK;DKRAW=null}};
  try{
    // prove the current password before anything changes
    let okCur=false;
    if(C.v===2)okCur=(await deriveV2(cur)).auth===C.sk;
    else okCur=sha256('s2sfp-sync:'+cur)===C.sk||(!!PW_DEFAULT&&pwHash(cur)===pwStored());
    if(!okCur){toast('Current password is wrong');if(btn)btn.disabled=false;return}
    // only the password changes: same data key, so the recovery key keeps working
    const d=await deriveV2(nw),keep=C.v===2&&C.wrap&&C.wrap.wp&&DKRAW;
    const dk=keep?DKRAW:crypto.getRandomValues(new Uint8Array(32));
    C.wrap=keep?Object.assign({},C.wrap,{wp:await lockRaw(dk,d.raw)}):{wp:await lockRaw(dk,d.raw),wr:null,rk:null,rdate:null};
    await setVK(dk);
    let r2;try{r2=await cCall('POST',{action:'rekey',newKey:d.auth,data:await sealData()})}catch(e){await undo();throw e}
    if(r2.status!==200){await undo();throw new Error(r2.j.error||'Error '+r2.status)}
    C.sk=d.auth;C.v=2;C.rev=r2.j.updated_at;C.dirty=false;C.err='';cSave();
    try{localStorage.setItem(PWKEY,pwHash(nw))}catch(e){}
    storeLocal();
    if(!C.wrap.wr)showKit(await makeRecovery(d.raw));
    else{render();toast('Password changed. Your recovery key still works.')}
  }catch(e){toast('Not changed: '+e.message);if(btn)btn.disabled=false}
}
/* lock automatically after 15 minutes without any taps, clicks or keys */
let lastAct=Date.now();
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(!document.body.classList.contains('locked')&&Date.now()-lastAct>15*60000){lockNow();$('#lock-err').textContent='Locked after 15 minutes of no activity.'}},30000);

/* ============ recovery key (version 3) ============ */
/* The planner is encrypted with a random data key (DK). The cloud keeps DK twice, each copy locked:
   wp = locked with the password key, wr = locked with a recovery key. The recovery key is shown once
   and can be emailed to RECOVERY_EMAIL as a reset link (#recover=…); it never goes to the server — only
   a hash of a key derived from it (rk), so the server can tell the owner apart without being able to
   open anything. A planner encrypted before recovery existed has no wp: its DK is the password key. */
const RECOVERY_EMAIL='support@s2sfit.com',PUBLIC_URL='https://s2sfit-sections.netlify.app/sections/fp-b31a1b741624449d.html';
const REC_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var DKRAW=null;
function newRecoveryKey(){const b=crypto.getRandomValues(new Uint8Array(25));let s='';b.forEach((x,i)=>{s+=REC_ALPHA[x%32]+((i%5===4&&i<24)?'-':'')});return s}
const recNorm=r=>String(r||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function deriveRec(r){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(recNorm(r)),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('s2s-fp-recovery-v3'),iterations:100000},base,512));
  return{auth:[...bits.subarray(0,32)].map(b=>b.toString(16).padStart(2,'0')).join(''),raw:bits.slice(32)};
}
async function lockRaw(raw,withRaw){const k=await crypto.subtle.importKey('raw',withRaw,'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,raw)))}}
async function unlockRaw(w,withRaw){const k=await crypto.subtle.importKey('raw',withRaw,'AES-GCM',false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(w.iv)},k,ub64(w.ct)))}
/* which data key a password opens: the locked copy if there is one, otherwise the password key itself */
const dkFor=async(wrap,pkRaw)=>wrap&&wrap.wp?unlockRaw(wrap.wp,pkRaw):pkRaw;
const wrapOf=d=>d&&d.enc?{wp:d.wp||null,wr:d.wr||null,rk:d.rk||null,rdate:d.rdate||null}:null;
async function sha256hex(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
/* new random data key + new recovery key; needs the password key to lock the data key for normal use */
async function makeRecovery(pkRaw){
  const dk=crypto.getRandomValues(new Uint8Array(32)),R=newRecoveryKey(),r=await deriveRec(R);
  C.wrap={wp:await lockRaw(dk,pkRaw),wr:await lockRaw(dk,r.raw),rk:await sha256hex('fpr:'+r.auth),rdate:iso(T)};
  await setVK(dk);cSave();
  const res=await cCall('POST',{data:await sealData(),base:C.rev||null,force:true});
  if(res.status!==200)throw new Error(res.j.error||'Error '+res.status);
  C.rev=res.j.updated_at;C.dirty=false;cSave();storeLocal();
  return R;
}
function showKit(R){
  const link=PUBLIC_URL+'#recover='+R,body='Financial Planner — recovery key\n\nIf the planner password is ever forgotten, open this link and choose a new password:\n'+link+'\n\nOr open the planner, tap "Forgot password?" and type this recovery key:\n'+R+'\n\nAnyone with this key can open the planner, so keep this email private and the mailbox protected with 2-step verification.\nCreated '+fd(T);
  UI.back=null;UI.dayOpen=null;$('#sheet').style.maxWidth='620px';
  $('#sheet').innerHTML='<div class="sheet-h"><h2>Your recovery key</h2></div>'+
    '<p style="font-size:13.5px;margin-bottom:12px">If you ever forget your password, this key — or the link in the email — lets you set a new one without losing anything. <b>It is shown only now.</b> Without it, a forgotten password means the data cannot be opened by anyone.</p>'+
    '<div class="preview" style="text-align:center;border-left-color:var(--gold)"><div style="font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.06em;word-break:break-all" id="kit-key">'+R+'</div></div>'+
    '<div class="acts" style="margin-bottom:14px"><a class="btn btn-primary" style="text-decoration:none" href="mailto:'+RECOVERY_EMAIL+'?subject='+encodeURIComponent('Financial Planner — recovery key')+'&body='+encodeURIComponent(body)+'">Email it to '+RECOVERY_EMAIL+'</a>'+
      '<button class="btn btn-ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText($(\'#kit-key\').textContent).then(()=>toast(\'Copied\'))">Copy</button>'+
      '<button class="btn btn-ghost" onclick="kitDownload()">Download</button></div>'+
    '<p class="muted" style="font-size:12.5px;margin-bottom:14px">“Email it” opens your mail app with the message ready — press Send. Anyone who gets into that mailbox could reset the planner, so keep 2-step verification on for '+RECOVERY_EMAIL+'.</p>'+
    '<label class="check" style="margin-bottom:12px"><input type="checkbox" id="kit-ok" onchange="$(\'#kit-done\').disabled=!this.checked">I have saved my recovery key</label>'+
    '<div class="sheet-f"><div></div><div class="acts"><button class="btn btn-primary" id="kit-done" disabled onclick="closeModal();render()">Done</button></div></div>';
  window.__kit=body;$('#modal').classList.add('open');
}
function kitDownload(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([window.__kit||''],{type:'text/plain'}));a.download='financial-planner-recovery-key.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function newRecovery(){
  const pw=$('#rk-pw').value;if(!pw){toast('Enter your password');return}
  toast('Working…');
  try{
    const d=await deriveV2(pw);if(d.auth!==C.sk){toast('Password is wrong');return}
    showKit(await makeRecovery(d.raw));
  }catch(e){toast('Not created: '+e.message)}
}
/* lock screen: forgot password → recovery key + new password */
function recShow(on,key){$('#lock-form').classList.toggle('hidden',!!on);$('#lock-rec').classList.toggle('hidden',!on);if(key!=null)$('#rec-key').value=key;$('#rec-err').textContent='';(on?$('#rec-key').value?$('#rec-new'):$('#rec-key'):$('#lock-pw')).focus()}
async function doRecover(){
  const R=$('#rec-key').value,nw=$('#rec-new').value,nw2=$('#rec-new2').value,err=t=>{$('#rec-err').textContent=t},chk=pwCheck(nw);
  if(recNorm(R).length!==25){err('A recovery key has 25 letters and numbers.');return}
  if(!chk.ok){err(chk.msg);return}if(nw!==nw2){err('The new passwords do not match.');return}
  if(!hasCrypto()){err('Open the planner from its web link to reset the password.');return}
  err('Checking…');
  try{
    const r=await deriveRec(R),call=async(m,b)=>{const res=await fetch(CLOUD_URL+'/functions/v1/'+(C.fn||CLOUD_FN),{method:m,headers:{apikey:CLOUD_KEY,'x-recovery-key':r.auth,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return{status:res.status,j:await res.json().catch(()=>({}))}};
    const g=await call('GET');
    if(g.status===429){err('Too many wrong attempts — try again later.');return}
    if(g.status!==200||!g.j.data||!g.j.data.wr){err('That recovery key does not match this planner.');return}
    const dk=await unlockRaw(g.j.data.wr,r.raw);await setVK(dk);
    S=merged(await decJSON(g.j.data.enc));LINK=null;LOCAL_ENC=null;
    const d=await deriveV2(nw);C.wrap={wp:await lockRaw(dk,d.raw),wr:g.j.data.wr,rk:g.j.data.rk,rdate:g.j.data.rdate||null};
    const p=await call('POST',{action:'recover',newKey:d.auth,data:await sealData()});
    if(p.status!==200){err(p.j.error||'Could not reset ('+p.status+').');return}
    C.sk=d.auth;C.v=2;C.rev=p.j.updated_at;C.dirty=false;C.off=false;C.err='';cSave();
    try{localStorage.setItem(PWKEY,pwHash(nw));sessionStorage.setItem(UNKEY,'1')}catch(e){}
    storeLocal();$('#rec-key').value=$('#rec-new').value=$('#rec-new2').value='';recShow(false);start();
    toast('Password reset. Your recovery key still works — make a new one in Settings if anyone else may have seen it.');
  }catch(e){err('That recovery key does not match this planner.')}
}
/* opened from the emailed link: fill in the key and drop it from the address bar */
function recFromHash(){const m=/^#recover=([A-Za-z0-9-]+)$/.exec(location.hash);if(!m)return;history.replaceState(null,'',location.pathname+location.search);try{sessionStorage.removeItem('s2s_fp_unlocked')}catch(e){}setTimeout(()=>{document.body.classList.add('locked');recShow(true,m[1])},0)}
recFromHash();window.addEventListener('hashchange',()=>{if(/^#recover=/.test(location.hash)){lockNow();recFromHash()}});

/* ============ password lock ============ */
/* Only a salted SHA-256 hash is kept in this file — never the password itself. Own implementation
   because crypto.subtle is missing in some browsers when the page is opened from file://. */
const PW_DEFAULT='',PWKEY='s2s_fp_pw',UNKEY='s2s_fp_unlocked';
function sha256(str){
  const K=[],H=[];let n=2;
  const frac=x=>((x-Math.floor(x))*4294967296)>>>0;
  while(K.length<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(H.length<8)H.push(frac(Math.sqrt(n)));K.push(frac(Math.cbrt(n)))}n++}
  const b=Array.from(new TextEncoder().encode(str)),bits=b.length*8,r=(x,k)=>(x>>>k)|(x<<(32-k)),w=new Array(64);
  b.push(128);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(i>3?0:(bits>>>(i*8))&255);
  for(let i=0;i<b.length;i+=64){
    for(let t=0;t<16;t++)w[t]=(b[i+4*t]<<24|b[i+4*t+1]<<16|b[i+4*t+2]<<8|b[i+4*t+3])>>>0;
    for(let t=16;t<64;t++){const s0=r(w[t-15],7)^r(w[t-15],18)^(w[t-15]>>>3),s1=r(w[t-2],17)^r(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let[a,c,d,e,f,g,h,j]=H;
    for(let t=0;t<64;t++){
      const t1=(j+(r(f,6)^r(f,11)^r(f,25))+((f&g)^(~f&h))+K[t]+w[t])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&c)^(a&d)^(c&d)))>>>0;
      j=h;h=g;g=f;f=(e+t1)>>>0;e=d;d=c;c=a;a=(t1+t2)>>>0;
    }
    [a,c,d,e,f,g,h,j].forEach((v,k)=>{H[k]=(H[k]+v)>>>0});
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
const pwHash=p=>sha256('s2sfp:'+p);
function pwStored(){try{return localStorage.getItem(PWKEY)||PW_DEFAULT}catch(e){return PW_DEFAULT}}
function start(){document.body.classList.remove('locked');render();cPull()}
/* Unlocking. The computer copy carries a hash of the password (PW_DEFAULT) and checks it locally; the
   web copy is built with PW_DEFAULT empty, so nothing in the public page helps anyone guess the
   password offline. Either way, once encryption is on the password is also turned into the decryption
   key, and the cloud is asked whether the derived sign-in key owns the planner. */
async function unlock(){
  const i=$('#lock-pw'),pw=i.value,err=t=>{$('#lock-err').textContent=t};
  const ok=async()=>{await openVault();try{sessionStorage.setItem(UNKEY,'1')}catch(e){}i.value='';err('');start()};
  if(!pw)return;
  if(PW_DEFAULT&&pwHash(pw)!==pwStored()){err('Wrong password — try again.');i.select();return}
  const enc=C.v===2||!!LOCAL_ENC;
  if(enc&&!hasCrypto()){err('This browser cannot open the encrypted planner. Use its web link instead.');return}
  err('Checking…');
  try{
    let d=null;
    if(hasCrypto()){d=await deriveV2(pw);if(C.sk&&C.v===2&&d.auth===C.sk){await setVK(await dkFor(C.wrap,d.raw));return ok()}}
    if(PW_DEFAULT&&!enc){if(!C.sk){C.sk=sha256('s2sfp-sync:'+pw);cSave()}return ok()}   // computer copy, not yet encrypted
    const ask=async key=>{const r=await fetch(CLOUD_URL+'/functions/v1/'+(C.fn||CLOUD_FN),{headers:{apikey:CLOUD_KEY,'x-planner-key':key}});return{status:r.status,j:await r.json().catch(()=>({}))}};
    let r=d?await ask(d.auth):{status:403};
    if(r.status===200&&r.j.data){C.sk=d.auth;C.v=2;C.wrap=wrapOf(r.j.data);C.rev=null;C.dirty=false;C.off=false;cSave();await setVK(await dkFor(C.wrap,d.raw));return ok()}
    if(r.status===403){                        // not encrypted yet: try the original sign-in key
      const k1=sha256('s2sfp-sync:'+pw);r=await ask(k1);
      if(r.status===200&&r.j.data){C.sk=k1;C.v=1;C.rev=null;C.dirty=false;C.off=false;cSave();return ok()}
    }
    if(r.status===429){err('Too many wrong attempts — sign-in is paused for a while. Try again later.');return}
    if(r.status===403){err('Wrong password — try again.');i.select();return}
    if(r.status===200){err('No planner is saved in the cloud yet. Open it on your computer first so it uploads.');return}
    err('Could not check the password just now ('+r.status+'). Try again in a moment.');
  }catch(e){err(navigator.onLine===false?'No internet connection — connect and try again.':'Could not unlock: '+e.message)}
}
function lockNow(){try{sessionStorage.removeItem(UNKEY)}catch(e){}
  // forget the key and take the decrypted planner out of memory; the encrypted browser copy stays
  if(VK&&C.v===2){dropVK();try{const d=JSON.parse(localStorage.getItem(KEY));LOCAL_ENC=d&&d.enc?d.enc:null}catch(e){}S=blank();LINK=null}else dropVK();
  UI.back=null;UI.q='';$('#q').value='';closeModal();document.body.classList.add('locked');$('#view').innerHTML='';$('#lock-pw').focus()}
function changePw(){
  if(!PW_DEFAULT||C.v===2){toast('Use the Encryption & password card above to change it');return}
  const cur=$('#pw-cur').value,a=$('#pw-new').value,b=$('#pw-new2').value;
  if(pwHash(cur)!==pwStored()){toast('Current password is wrong');return}
  if(a.length<6){toast('New password needs at least 6 characters');return}
  if(a!==b){toast('The new passwords do not match');return}
  try{localStorage.setItem(PWKEY,pwHash(a))}catch(e){toast('Could not save the new password');return}
  render();toast('Password changed');
}
let unlocked=false;try{unlocked=sessionStorage.getItem(UNKEY)==='1'}catch(e){}
/* reopen in the same tab without the password (the session key is kept until the tab closes) */
(async()=>{
  if(!unlocked||!(C.sk||C.off))return;
  if(C.v===2||LOCAL_ENC){let raw=null;try{raw=sessionStorage.getItem(VKEY)}catch(e){}if(!raw||!hasCrypto())return;try{await setVK(ub64(raw));await openVault()}catch(e){dropVK();return}}
  start();
})();
